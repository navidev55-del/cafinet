<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>CafeNet — ارسال و چاپ حرفه‌ای</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#4f46e5;--pri-dark:#4338ca;--pri-light:#eef2ff;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;--ok:#16a34a;--warn:#eab308;--err:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.hide{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Customer ---------- */
.c-wrap{max-width:560px;margin:0 auto;padding:16px}
.c-card{background:var(--card);border-radius:24px;padding:28px;box-shadow:0 20px 50px -12px rgba(15,23,42,.15);border:1px solid rgba(255,255,255,.6);animation:slideUp .5s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.c-card h1{font-size:22px;margin:0 0 8px;font-weight:800;letter-spacing:-.5px}
.c-sub{color:var(--mut);font-size:14px;margin:0 0 20px;line-height:1.8;font-weight:400}
.c-label{display:block;font-size:13px;font-weight:600;margin:0 0 8px;color:#334155}
.c-input{width:100%;padding:16px;border:2px solid var(--line);border-radius:14px;font-size:16px;outline:none;background:#fff;transition:.2s}
.c-input:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.c-drop{margin-top:18px;border:2px dashed #c7d2fe;border-radius:18px;padding:28px 20px;text-align:center;background:linear-gradient(135deg,#f5f7ff,#eef2ff);transition:.3s;cursor:pointer}
.c-drop.drag{background:#e0e7ff;border-color:var(--pri);transform:scale(1.02)}
.c-drop .ic{font-size:42px;line-height:1;margin-bottom:8px}
.c-drop .t{font-weight:700;font-size:15px;margin-top:6px}
.c-drop .s{font-size:12px;color:var(--mut);margin-top:6px}
.c-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:0;border-radius:14px;font-size:15px;font-weight:700;margin-top:10px;transition:.2s;position:relative;overflow:hidden}
.c-btn:active{transform:scale(.97)}
.c-btn:disabled{opacity:.5;cursor:not-allowed}
.c-btn.sec{background:var(--pri-light);color:var(--pri-dark)}
.c-btn.sec:hover:not(:disabled){background:#e0e7ff}
.c-btn.pri{background:linear-gradient(135deg,var(--pri),#7c3aed);color:#fff;box-shadow:0 8px 20px -6px rgba(79,70,229,.5)}
.c-btn.pri:hover:not(:disabled){background:linear-gradient(135deg,var(--pri-dark),#6d28d9);box-shadow:0 10px 24px -6px rgba(79,70,229,.6)}
.c-files{margin-top:18px}
.c-file{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff;transition:.2s;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.c-file:hover{border-color:#c7d2fe;background:#fafaff}
.c-file img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#e2e8f0;flex:0 0 auto}
.c-file .ph{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#e2e8f0;border-radius:10px;flex:0 0 auto}
.c-file .info{flex:1;min-width:0}
.c-file .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-file .sz{font-size:11px;color:var(--mut);margin-top:3px}
.c-file .rm{width:34px;height:34px;border:0;border-radius:10px;background:#fef2f2;color:#b91c1c;font-weight:700;font-size:16px;flex:0 0 auto;transition:.2s}
.c-file .rm:hover{background:#fee2e2}
.c-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:16px;display:none}
.c-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6366f1,#8b5cf6,#a78bfa);transition:width .3s;border-radius:99px}
.c-upload-info{font-size:12px;color:var(--mut);text-align:center;margin-top:8px;display:none}
.c-err{display:none;margin-top:14px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.6;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.c-ok{display:none;text-align:center;padding:32px 0}
.c-ok .tick{font-size:72px;line-height:1;animation:pop .5s cubic-bezier(.16,1,.3,1)}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.c-ok h2{margin:14px 0 8px;font-size:21px;font-weight:800}
.c-ok p{color:var(--mut);font-size:14px;margin:0 0 20px;line-height:1.8}
.c-tracking{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:12px;border-radius:12px;font-size:13px;margin-bottom:18px;font-family:monospace;letter-spacing:1px}

/* ---------- Owner Panel ---------- */
.o-app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.o-top{height:62px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;flex:0 0 auto;box-shadow:0 1px 3px rgba(0,0,0,.04);z-index:10}
.o-top strong{font-size:16px;font-weight:800;white-space:nowrap;letter-spacing:-.3px}
.o-badge{background:var(--pri-light);color:var(--pri-dark);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.o-dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1;transition:.3s;flex:0 0 auto}
.o-dot.on{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.25);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(34,197,94,.25)}50%{box-shadow:0 0 0 8px rgba(34,197,94,.1)}}
.o-spacer{flex:1}
.o-tbtn{padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;font-weight:600;color:#334155;white-space:nowrap;transition:.2s}
.o-tbtn:hover{background:#f8fafc;border-color:#cbd5e1}
.o-tbtn.on{background:var(--pri-light);color:var(--pri-dark);border-color:#c7d2fe}
.o-wrap{flex:1;display:flex;min-height:0}
.o-side{width:340px;flex:0 0 auto;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.o-search{padding:12px;border-bottom:1px solid var(--line)}
.o-search input{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;outline:none;transition:.2s;background:#f8fafc}
.o-search input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.o-filters{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex:0 0 auto}
.o-chip{padding:6px 14px;border:1.5px solid var(--line);background:#fff;border-radius:99px;font-size:12px;font-weight:600;color:#475569;white-space:nowrap;flex:0 0 auto;transition:.2s}
.o-chip.active{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(79,70,229,.3)}
.o-list{flex:1;overflow-y:auto;padding:10px}
.o-item{display:flex;gap:10px;padding:10px;border-radius:14px;cursor:pointer;border:2px solid transparent;margin-bottom:6px;align-items:center;transition:.15s;position:relative;background:#fff}
.o-item:hover{background:#f8fafc;border-color:#e2e8f0}
.o-item.sel{background:var(--pri-light);border-color:#c7d2fe}
.o-item.checked{background:#f0fdf4;border-color:#86efac}
.o-item .chk{width:22px;height:22px;border:2px solid #cbd5e1;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff;font-size:14px;color:#fff;transition:.2s}
.o-item.checked .chk{background:var(--ok);border-color:var(--ok)}
.o-item img,.o-item .ph{width:50px;height:50px;border-radius:10px;object-fit:cover;background:#e2e8f0;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:22px}
.o-item .info{min-width:0;flex:1}
.o-item .nm{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.o-item .tm{font-size:11px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:6px}
.o-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;flex:0 0 auto}
.o-status.new{background:#fef3c7;color:#92400e}
.o-status.printing{background:#dbeafe;color:#1e40af}
.o-status.done{background:#dcfce7;color:#166534}
.o-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:#e9edf3}
.o-empty{margin:auto;color:var(--mut);font-size:14px;text-align:center;padding:30px;line-height:1.8}
.o-empty .ic{font-size:60px;margin-bottom:12px;opacity:.6}
.o-editor{display:flex;flex-direction:column;height:100%;min-height:0}
.o-tools{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;flex:0 0 auto;max-height:100px;overflow-y:auto}
.o-grp{display:flex;align-items:center;gap:6px}
.o-grp label{font-size:12px;color:#475569;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
input[type=range]{width:80px;accent-color:var(--pri);height:6px}
.o-btn{padding:7px 12px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-size:12.5px;font-weight:600;color:#334155;white-space:nowrap;transition:.15s}
.o-btn:hover{background:#f8fafc;border-color:#cbd5e1}
.o-btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(79,70,229,.25)}
.o-btn.pri:hover{background:var(--pri-dark)}
.o-btn.danger{color:#b91c1c;border-color:#fecaca}
.o-btn.danger:hover{background:#fef2f2}
.o-btn.on{background:var(--pri-dark);color:#fff;border-color:var(--pri-dark)}
.o-btn:disabled{opacity:.4;cursor:not-allowed}
select{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:12.5px;background:#fff;transition:.2s}
select:focus{border-color:var(--pri);outline:none}
.o-stage{flex:1;overflow:auto;padding:20px;display:flex;align-items:center;justify-content:center;min-height:0}
.o-cwrap{position:relative;max-width:100%;max-height:100%;display:inline-block;line-height:0}
#view{display:block;max-width:100%;max-height:calc(100vh - 230px);width:auto;height:auto;box-shadow:0 10px 40px -10px rgba(15,23,42,.3);background:#fff;border-radius:4px;touch-action:none}
.cropbox{position:absolute;border:2px dashed var(--pri);background:rgba(79,70,229,.15);display:none;pointer-events:none;border-radius:2px}
.o-nofile{padding:50px;text-align:center;color:var(--mut);margin:auto}
.o-nofile .ic{font-size:56px}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#fff;padding:14px 22px;border-radius:14px;font-size:13.5px;font-weight:500;transition:.4s cubic-bezier(.16,1,.3,1);z-index:9999;opacity:0;max-width:90vw;text-align:center;box-shadow:0 12px 32px -8px rgba(0,0,0,.35)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:9000;padding:16px;animation:fadeIn .2s ease}
.modal.on{display:flex}
.modal-card{background:#fff;border-radius:20px;padding:26px;max-width:440px;width:100%;box-shadow:0 24px 64px -12px rgba(0,0,0,.4);animation:slideUp .3s ease}
.modal-card h3{margin:0 0 18px;font-size:18px;font-weight:800}
.modal-card label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin:14px 0 6px}
.modal-card select,.modal-card input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;transition:.2s}
.modal-card select:focus,.modal-card input:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions button{flex:1;padding:13px;border:0;border-radius:12px;font-size:14px;font-weight:700;transition:.2s}
.modal-actions .cancel{background:#f1f5f9;color:#475569}
.modal-actions .cancel:hover{background:#e2e8f0}
.modal-actions .ok{background:linear-gradient(135deg,var(--pri),#7c3aed);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.modal-actions .ok:hover{background:linear-gradient(135deg,var(--pri-dark),#6d28d9)}

/* responsive */
@media(max-width:900px){
  .o-wrap{flex-direction:column}
  .o-side{width:100%;height:190px;border-left:0;border-bottom:1px solid var(--line)}
  .o-search{padding:8px 10px}
  .o-filters{padding:6px 10px}
  .o-list{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px}
  .o-item{width:220px;flex:0 0 auto;margin:0}
  .o-tools{max-height:none;padding:8px 10px}
  .o-top{padding:0 12px;gap:8px}
  .o-top strong{font-size:14px}
  .o-tbtn{padding:6px 10px;font-size:12px}
}
@media(max-width:480px){
  .c-card{padding:20px;border-radius:20px}
  .c-card h1{font-size:19px}
  .c-drop{padding:22px 16px}
  .o-stage{padding:10px}
}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

<!-- Batch print modal -->
<div class="modal" id="batchModal">

<script>
/* =====================================================
   CONFIG — این بخش را حتماً ویرایش کنید
   ===================================================== */
const CONFIG = {
  TOPIC: 'printshop-a7x9k2m3q8v1',   // ⚠️ به یک رشته تصادفی طولانی تغییر دهید
  NTFY: 'https://ntfy.sh',
  OWNER_PASSWORD: 'admin123',          // ⚠️ رمز دلخواه خود را بگذارید
  MAX_MB: 10,   // محدودیت ۱۰ مگابایت (ntfy.sh سقف ۱۵ مگابایت دارد)
  MAX_FILES: 8,
};

/* =====================================================
   UTILITIES
   ===================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => { try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return s; } };
const fmtTime = ts => {
  const d = new Date(ts*1000), p = n => n<10?'0'+n:''+n;
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  return p(d.getHours())+':'+p(d.getMinutes())+(isToday?'':' · '+p(d.getDate())+'/'+(d.getMonth()+1));
};
const fmtSize = bytes => bytes < 1024 ? bytes+' B'
  : bytes < 1048576 ? (bytes/1024).toFixed(0)+' KB'
  : (bytes/1048576).toFixed(2)+' MB';
const uid = () => 'x' + Math.random().toString(36).slice(2,9);

let toastTimer;
function toast(msg, kind){
  const t = $('#toast');
  if(!t) return;
  t.textContent = msg;
  t.style.background = kind === 'ok' ? '#15803d' : kind === 'err' ? '#b91c1c' : '#0f172a';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function beep(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    [880, 1175].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = 'sine';
      const t = ctx.currentTime + i * 0.15;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.start(t); osc.stop(t + 0.3);
    });
  }catch(e){}
}

/* فشرده‌سازی عکس برای کاهش حجم و جلوگیری از خطای 413 */
function compressImage(file, maxDim = 2400, quality = 0.85){
  return new Promise(resolve => {
    if(!file.type.startsWith('image/') || file.type === 'image/gif') { resolve(file); return; }
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      if(Math.max(w, h) > maxDim){
        const s = maxDim / Math.max(w, h);
        w = Math.round(w * s); h = Math.round(h * s);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob(blob => {
        if(blob && blob.size < file.size){
          resolve(new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', {type:'image/jpeg'}));
        } else {
          resolve(file);
        }
      }, 'image/jpeg', quality);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

function isOwnerMode(){ return location.hash.includes('owner'); }

/* =====================================================
   CUSTOMER PAGE
   ===================================================== */
function renderCustomer(){
  document.title = 'ارسال فایل · CafeNet';
  $('#app').innerHTML = `
    <div class="c-wrap">
      <div class="c-card">
        <div id="cForm">
          <h1>📤 ارسال عکس برای چاپ</h1>
          <p class="c-sub">نام خود را وارد کنید و عکس یا فایلی که می‌خواهید چاپ شود را بارگذاری کنید.</p>

          <label class="c-label" for="cName">نام و نام خانوادگی</label>
          <input class="c-input" id="cName" type="text" placeholder="مثلاً: علی رضایی" autocomplete="name">

          <div class="c-drop" id="cDrop">
            <div class="ic">📷</div>
            <div class="t">عکس یا فایل خود را انتخاب کنید</div>
            <div class="s">عکس، PDF یا فایل · تا ${CONFIG.MAX_MB} مگابایت</div>
            <button class="c-btn sec" id="cPick">📁 انتخاب از گالری</button>
            <button class="c-btn sec" id="cCam">📸 گرفتن عکس</button>
          </div>

          <div class="c-files" id="cFiles"></div>

          <div class="c-bar" id="cBar"><i id="cBarI"></i></div>
          <div class="c-upload-info" id="cInfo"></div>
          <div class="c-err" id="cErr"></div>

          <button class="c-btn pri" id="cSend" disabled>🚀 ارسال</button>
        </div>

        <div class="c-ok" id="cOk">
          <div class="tick">✅</div>
          <h2>با موفقیت ارسال شد</h2>
          <p>فایل شما دریافت شد و در صف چاپ قرار گرفت.</p>
          <div class="c-tracking" id="cTrack"></div>

function wireCustomer(){
  const nameEl = $('#cName'), fileEl = $('#cFile'), camEl = $('#cCamIn');
  const filesEl = $('#cFiles'), sendBtn = $('#cSend');
  const bar = $('#cBar'), barI = $('#cBarI'), info = $('#cInfo');
  const errEl = $('#cErr'), form = $('#cForm'), ok = $('#cOk');
  const dropZone = $('#cDrop');

  let files = [];

  const showError = m => { errEl.textContent = m; errEl.style.display = 'block'; };
  const clearError = () => { errEl.style.display = 'none'; };

  function updateUI(){
    filesEl.innerHTML = '';
    files.forEach(f => {
      const div = document.createElement('div');
      div.className = 'c-file';
      if(f.thumb){
        div.innerHTML = `<img src="${f.thumb}" alt=""><div class="info"><div class="nm">${esc(f.file.name)}</div><div class="sz">${fmtSize(f.file.size)}</div></div><button class="rm" data-id="${f.id}">✕</button>`;
      } else {
        div.innerHTML = `<div class="ph">📄</div><div class="info"><div class="nm">${esc(f.file.name)}</div><div class="sz">${fmtSize(f.file.size)}</div></div><button class="rm" data-id="${f.id}">✕</button>`;
      }
      filesEl.appendChild(div);
    });
    filesEl.querySelectorAll('.rm').forEach(b => {
      b.onclick = () => {
        const i = files.findIndex(x => x.id === b.dataset.id);
        if(i >= 0){ if(files[i].thumb) URL.revokeObjectURL(files[i].thumb); files.splice(i,1); updateUI(); }
      };
    });
    sendBtn.disabled = files.length === 0;
    sendBtn.textContent = files.length > 0 ? `🚀 ارسال ${files.length} فایل` : '🚀 ارسال';
  }

  async function addFiles(list){
    clearError();
    const arr = Array.from(list || []);
    for(const file of arr){
      if(files.length >= CONFIG.MAX_FILES){ showError(`حداکثر ${CONFIG.MAX_FILES} فایل`); break; }
      if(file.size > CONFIG.MAX_MB * 1024 * 1024){ showError(`«${file.name}» بزرگ‌تر از ${CONFIG.MAX_MB}MB است`); continue; }
      const thumb = file.type.startsWith('image/') ? URL.createObjectURL(file) : null;
      files.push({ id: uid(), file, thumb });
      updateUI();
    }
  }

  $('#cPick').onclick = () => fileEl.click();
  $('#cCam').onclick  = () => camEl.click();
  fileEl.onchange = () => { addFiles(fileEl.files); fileEl.value=''; };
  camEl.onchange  = () => { addFiles(camEl.files); camEl.value=''; };
  nameEl.oninput  = clearError;

  // Drag & drop
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag');
    addFiles(e.dataTransfer.files);
  });

  /* ---------- ارسال ---------- */
  sendBtn.onclick = async () => {
    const name = nameEl.value.trim();
    if(!name){ showError('لطفاً نام خود را وارد کنید.'); nameEl.focus(); return; }
    if(!files.length){ showError('لطفاً حداقل یک فایل انتخاب کنید.'); return; }

    sendBtn.disabled = true;
    sendBtn.textContent = 'در حال آماده‌سازی...';
    clearError();
    bar.style.display = 'block'; barI.style.width = '0';
    info.style.display = 'block'; info.textContent = 'در حال فشرده‌سازی عکس‌ها...';

    try{
      const prepared = [];
      for(let i = 0; i < files.length; i++){
        info.textContent = `فشرده‌سازی ${i+1} از ${files.length}...`;
        const compressed = await compressImage(files[i].file);
        prepared.push(compressed);
      }

      const tracking = [];
      for(let i = 0; i < prepared.length; i++){
        info.textContent = `آپلود ${i+1} از ${prepared.length}...`;
        const result = await sendOneFile(name, prepared[i], (pct) => {
          const total = ((i + pct/100) / prepared.length) * 100;
          barI.style.width = total.toFixed(0) + '%';
        });
        tracking.push(result.id);
      }

      barI.style.width = '100%';
      setTimeout(() => {
        form.style.display = 'none';
        ok.style.display = 'block';
        const trackText = tracking.length === 1
          ? `کد رهگیری: ${tracking[0].slice(0, 8)}`
          : `کد رهگیری: ${tracking.map(t => t.slice(0,6)).join(' · ')}`;
        $('#cTrack').textContent = trackText;
      }, 400);

    }catch(err){
      console.error(err);
      bar.style.display = 'none';
      info.style.display = 'none';
      showError(err.message || 'خطا در ارسال. اتصال اینترنت را بررسی کنید.');
      sendBtn.disabled = false;
      sendBtn.textContent = files.length > 0 ? `🚀 ارسال ${files.length} فایل` : '🚀 ارسال';
    }
  };

  /* ---------- آپلود یک فایل به ntfy — استفاده از Query Param برای پشتیبانی کامل Unicode ---------- */
  function sendOneFile(name, file, onProgress){
    return new Promise((resolve, reject) => {
      const qs = new URLSearchParams();
      qs.set('title', name.slice(0, 40));
      qs.set('message', JSON.stringify({ name: name, size: file.size, type: file.type }));
      qs.set('filename', file.name || 'file');
      qs.set('tags', 'printer');

      const url = `${CONFIG.NTFY}/${CONFIG.TOPIC}?${qs.toString()}`;
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', url);

      xhr.upload.onprogress = e => {
        if(e.lengthComputable && onProgress) onProgress((e.loaded/e.total)*100);
      };
      xhr.onload = () => {
        if(xhr.status >= 200 && xhr.status < 300){
          try{
            const res = JSON.parse(xhr.responseText);
            resolve({ id: res.id || uid() });
          }catch(e){ resolve({ id: uid() }); }
        } else if(xhr.status === 413){
          reject(new Error('فایل خیلی بزرگ است (سقف ۱۵ مگابایت ntfy.sh)'));
        } else if(xhr.status === 429){
          reject(new Error('محدودیت ارسال. کمی صبر کنید.'));
        } else {
          reject(new Error(`خطا در سرور (${xhr.status})`));
        }
      };
      xhr.onerror = () => reject(new Error('اتصال برقرار نشد. اینترنت را بررسی کنید.'));
      xhr.timeout = 90000;
      xhr.ontimeout = () => reject(new Error('زمان ارسال تمام شد.'));
      xhr.send(file);
    });
  }

  /* ---------- ارسال دوباره ---------- */
  $('#cAgain').onclick = () => {
    files.forEach(f => f.thumb && URL.revokeObjectURL(f.thumb));
    files = [];
    updateUI();
    bar.style.display = 'none'; barI.style.width = '0';
    info.style.display = 'none';
    ok.style.display = 'none'; form.style.display = 'block';
    nameEl.value = ''; nameEl.focus();
  };
}

function wireOwner(){
  const S = {
    items: [], current: null, base: null, orig: null,
    rot: 0, free: 0, zoom: 1, bright: 100, contrast: 100, filter: 'none',
    cropMode: false, cropRect: null,
    selected: new Set(), filter: 'all', search: '',
  };
  const view = $('#view'), vctx = view.getContext('2d'), cropbox = $('#cropbox');
  const listEl = $('#oList'), emptyEl = $('#oEmpty'), editor = $('#oEditor'), nofile = $('#oNofile');

  const cloneCanvas = src => {
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    c.getContext('2d').drawImage(src, 0, 0);
    return c;
  };

  /* ---------- رندر لیست ---------- */
  function renderList(){
    $('#oCount').textContent = S.items.length;
    const statuses = STORE.statuses;
    const filtered = S.items.filter(it => {
      if(S.filter !== 'all' && (statuses[it.id] || 'new') !== S.filter) return false;
      if(S.search && !it.name.toLowerCase().includes(S.search.toLowerCase())) return false;
      return true;
    });

    listEl.innerHTML = '';
    if(filtered.length === 0){
      listEl.innerHTML = '<div style="text-align:center;padding:40px 10px;color:#94a3b8;font-size:13px">موردی یافت نشد</div>';
      return;
    }

    filtered.forEach(it => {
      const st = statuses[it.id] || 'new';
      const div = document.createElement('div');
      div.className = 'o-item' + (S.current && S.current.id === it.id ? ' sel' : '') + (S.selected.has(it.id) ? ' checked' : '');

      const chk = document.createElement('div');
      chk.className = 'chk';
      chk.textContent = '✓';
      chk.onclick = e => {
        e.stopPropagation();
        if(S.selected.has(it.id)) S.selected.delete(it.id);
        else S.selected.add(it.id);
        renderList();
      };
      div.appendChild(chk);

      if((it.mime||'').startsWith('image/')){
        const im = document.createElement('img');
        im.src = it.localBlobUrl || it.url;
        im.loading = 'lazy';
        im.onerror = () => { im.style.display = 'none'; };
        div.appendChild(im);
      } else {
        const ph = document.createElement('div');
        ph.className = 'ph'; ph.textContent = '📄';
        div.appendChild(ph);
      }

      const info = document.createElement('div');
      info.className = 'info';
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.innerHTML = `${esc(it.name)} <span class="o-status ${st}">${st === 'new'?'جدید':st==='printing'?'در چاپ':'چاپ شد'}</span>`;
      const tm = document.createElement('div');
      tm.className = 'tm';
      tm.textContent = fmtTime(it.time) + (it.size ? ' · ' + fmtSize(it.size) : '');
      info.appendChild(nm); info.appendChild(tm);
      div.appendChild(info);

      div.onclick = () => openItem(it);
      listEl.appendChild(div);
    });
  }

  /* ---------- باز کردن آیتم ---------- */
  function openItem(it){
    S.current = it;
    S.cropMode = false; S.cropRect = null;
    cropbox.style.display = 'none';
    $('#oCrop').classList.remove('on');
    $('#oStatusSel').value = STORE.statuses[it.id] || 'new';
    renderList();
    emptyEl.classList.add('hide');
    editor.classList.add('hide');
    nofile.classList.add('hide');

    if(!(it.mime||'').startsWith('image/')){
      nofile.classList.remove('hide');
      $('#oNofileTxt').textContent = it.name || 'فایل';
      $('#oOpenRaw').href = it.localBlobUrl || it.url;
      $('#oPrintRaw').onclick = () => {
        const w = window.open(it.localBlobUrl || it.url, '_blank');
        if(w) setTimeout(() => { try{ w.print(); }catch(e){} }, 900);
      };
      return;
    }

    editor.classList.remove('hide');
    const im = new Image();
    if(it.localBlobUrl) im.src = it.localBlobUrl;
    else { im.crossOrigin = 'anonymous'; im.src = it.url; }
    im.onload = () => {
      const maxDim = 3200;
      const w = im.naturalWidth, h = im.naturalHeight;
      const sc = Math.min(1, maxDim / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * sc));
      c.height = Math.max(1, Math.round(h * sc));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      S.orig = c; S.base = cloneCanvas(c);
      resetTransforms();
      render();
    };
    im.onerror = () => {
      editor.classList.add('hide');
      nofile.classList.remove('hide');
      $('#oNofileTxt').textContent = 'خطا در بارگذاری';
      $('#oOpenRaw').href = it.localBlobUrl || it.url;
    };
  }

  function resetTransforms(){
    S.rot = 0; S.free = 0; S.zoom = 1; S.bright = 100; S.contrast = 100; S.filter = 'none';
    $('#sAngle').value = 0; $('#sZoom').value = 1;
    $('#sBright').value = 100; $('#sContrast').value = 100;
    $('#oFilter').value = 'none';
  }

  function renderFull(){
    const b = S.base; if(!b) return null;
    const angle = (S.rot + S.free) * Math.PI / 180;
    const w = b.width, h = b.height;
    const cos = Math.abs(Math.cos(angle)), sin = Math.abs(Math.sin(angle));
    const outW = Math.max(1, Math.round((w*cos + h*sin) * S.zoom));
    const outH = Math.max(1, Math.round((w*sin + h*cos) * S.zoom));
    const c = document.createElement('canvas');
    c.width = outW; c.height = outH;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, outW, outH);
    ctx.translate(outW/2, outH/2);
    ctx.rotate(angle);
    ctx.scale(S.zoom, S.zoom);
    const filt = `brightness(${S.bright}%) contrast(${S.contrast}%) ${S.filter === 'none' ? '' : S.filter}`;
    ctx.filter = filt;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(b, -w/2, -h/2);
    return c;
  }

  function render(){
    const full = renderFull(); if(!full) return;
    const maxDim = 1400;
    const s = Math.min(1, maxDim / Math.max(full.width, full.height));
    view.width = Math.max(1, Math.round(full.width * s));
    view.height = Math.max(1, Math.round(full.height * s));
    vctx.clearRect(0, 0, view.width, view.height);
    vctx.drawImage(full, 0, 0, view.width, view.height);
  }

  /* ---------- کنترل‌ها ---------- */
  $('#oRotL').onclick = () => { S.rot -= 90; render(); };
  $('#oRotR').onclick = () => { S.rot += 90; render(); };
  $('#sAngle').oninput    = e => { S.free = parseFloat(e.target.value); render(); };
  $('#sZoom').oninput     = e => { S.zoom = parseFloat(e.target.value); render(); };
  $('#sBright').oninput   = e => { S.bright = parseFloat(e.target.value); render(); };
  $('#sContrast').oninput = e => { S.contrast = parseFloat(e.target.value); render(); };
  $('#oFilter').onchange  = e => { S.filter = e.target.value; render(); };

  $('#oApply').onclick = () => {
    const full = renderFull(); if(!full) return;
    S.base = full; resetTransforms(); render();
    toast('تغییرات اعمال شد', 'ok');
  };
  $('#oReset').onclick = () => {
    if(!S.orig) return;
    S.base = cloneCanvas(S.orig); resetTransforms(); render();
    toast('به تصویر اصلی برگشت');
  };

  $('#oStatusSel').onchange = e => {
    if(!S.current) return;
    const s = STORE.statuses;
    s[S.current.id] = e.target.value;
    STORE.statuses = s;
    renderList();
    toast('وضعیت به‌روز شد', 'ok');
  };

  /* ---------- Crop ---------- */
  $('#oCrop').onclick = () => {
    S.cropMode = !S.cropMode;
    $('#oCrop').classList.toggle('on', S.cropMode);
    if(!S.cropMode){ cropbox.style.display = 'none'; S.cropRect = null; }
    else toast('روی تصویر بکشید تا کادر برش ساخته شود');
  };

  let dragging = false, sx = 0, sy = 0;
  const posOf = e => {
    const r = view.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: Math.max(0, Math.min(r.width, p.clientX - r.left)),
             y: Math.max(0, Math.min(r.height, p.clientY - r.top)) };
  };
  function startDrag(e){
    if(!S.cropMode) return;
    e.preventDefault(); dragging = true;
    const p = posOf(e); sx = p.x; sy = p.y;
    S.cropRect = { x:p.x, y:p.y, w:0, h:0 }; updateCropBox();
  }
  function moveDrag(e){
    if(!dragging) return;
    e.preventDefault();
    const p = posOf(e);
    S.cropRect = { x: Math.min(sx,p.x), y: Math.min(sy,p.y), w: Math.abs(p.x-sx), h: Math.abs(p.y-sy) };
    updateCropBox();
  }
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    if(!S.cropRect || S.cropRect.w < 12 || S.cropRect.h < 12){
      S.cropRect = null; cropbox.style.display = 'none'; return;
    }
    applyCrop();
  }
  function updateCropBox(){
    if(!S.cropRect){ cropbox.style.display = 'none'; return; }
    cropbox.style.display = 'block';
    cropbox.style.left = S.cropRect.x+'px'; cropbox.style.top = S.cropRect.y+'px';
    cropbox.style.width = S.cropRect.w+'px'; cropbox.style.height = S.cropRect.h+'px';
  }
  function applyCrop(){
    const full = renderFull();
    if(!full || !S.cropRect) return;
    const r = view.getBoundingClientRect();
    const sclX = full.width / r.width, sclY = full.height / r.height;
    let cx = Math.round(S.cropRect.x*sclX), cy = Math.round(S.cropRect.y*sclY);
    let cw = Math.round(S.cropRect.w*sclX), ch = Math.round(S.cropRect.h*sclY);
    if(cw < 5 || ch < 5) return;
    cx = Math.max(0, Math.min(full.width-1, cx));
    cy = Math.max(0, Math.min(full.height-1, cy));
    cw = Math.min(cw, full.width-cx); ch = Math.min(ch, full.height-cy);
    const nc = document.createElement('canvas');
    nc.width = cw; nc.height = ch;
    nc.getContext('2d').drawImage(full, cx, cy, cw, ch, 0, 0, cw, ch);
    S.base = nc; resetTransforms();
    S.cropMode = false; S.cropRect = null;
    $('#oCrop').classList.remove('on');
    cropbox.style.display = 'none';
    render(); toast('برش انجام شد', 'ok');
  }
  view.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  view.addEventListener('touchstart', startDrag, {passive:false});
  window.addEventListener('touchmove', moveDrag, {passive:false});
  window.addEventListener('touchend', endDrag);

  /* ---------- Print ---------- */
  $('#oPrint').onclick = () => {
    const full = renderFull(); if(!full) return;
    const url = full.toDataURL('image/jpeg', 0.94);
    const doc = `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>چاپ</title>
      <style>@page{size:A4;margin:8mm}html,body{margin:0;padding:0;height:100%}
      body{display:flex;align-items:center;justify-content:center}
      img{max-width:100%;max-height:100%;object-fit:contain}</style></head>
      <body><img src="${url}" onload="setTimeout(()=>window.print(),250)"></body></html>`;
    const w = window.open('', '_blank');
    if(!w){ toast('پاپ‌آپ را فعال کنید', 'err'); return; }
    w.document.open(); w.document.write(doc); w.document.close();
  };

  /* ---------- Download ---------- */
  $('#oDownload').onclick = () => {
    const full = renderFull(); if(!full) return;
    const a = document.createElement('a');
    a.href = full.toDataURL('image/jpeg', 0.94);
    a.download = (S.current ? (S.current.name || 'file') : 'file') + '.jpg';
    a.click();
  };

  /* ---------- Delete ---------- */
  $('#oDel').onclick = () => {
    if(!S.current) return;
    if(!confirm('این مورد از لیست حذف شود؟')) return;
    S.items = S.items.filter(x => x.id !== S.current.id);
    const st = STORE.statuses; delete st[S.current.id]; STORE.statuses = st;
    S.selected.delete(S.current.id);
    S.current = null; S.base = null; S.orig = null;
    editor.classList.add('hide'); emptyEl.classList.remove('hide');
    renderList(); toast('حذف شد');
  };

  /* ---------- Batch print ---------- */
  $('#oBatch').onclick = () => {
    if(S.selected.size === 0){ toast('ابتدا موارد را با ✅ علامت بزنید', 'err'); return; }
    $('#batchModal').classList.add('on');
  };
  $('#bmGo').onclick = async () => {
    const perPage = parseInt($('#bmPerPage').value);
    const copies = Math.max(1, parseInt($('#bmCopies').value) || 1);
    const gap = parseInt($('#bmGap').value);
    $('#batchModal').classList.remove('on');

    const items = S.items.filter(x => S.selected.has(x.id));
    const itemsExpanded = [];
    items.forEach(it => { for(let i = 0; i < copies; i++) itemsExpanded.push(it); });

    toast('در حال آماده‌سازی...', 'ok');

    const canvases = [];
    for(const it of itemsExpanded){
      try{
        const c = await getCanvasForItem(it);
        if(c) canvases.push(c);
      }catch(e){ console.warn(e); }
    }
    if(canvases.length === 0){ toast('خطا در آماده‌سازی', 'err'); return; }

    const cols = perPage === 1 ? 1 : perPage === 2 ? 2 : perPage === 4 ? 2 : 3;
    const rows = Math.ceil(perPage / cols);
    const pages = [];
    for(let i = 0; i < canvases.length; i += perPage){
      const chunk = canvases.slice(i, i + perPage);
      const cells = chunk.map(c => `<div class="cell"><img src="${c.toDataURL('image/jpeg', 0.9)}"></div>`).join('');
      pages.push(`<div class="page">${cells}</div>`);
    }
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>چاپ دسته‌ای</title>
      <style>
        @page{size:A4;margin:5mm}
        *{box-sizing:border-box}
        html,body{margin:0;padding:0}
        .page{display:grid;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);
              gap:${gap}mm;width:200mm;height:287mm;page-break-after:always}
        .page:last-child{page-break-after:auto}
        .cell{display:flex;align-items:center;justify-content:center;overflow:hidden}
        .cell img{max-width:100%;max-height:100%;object-fit:contain}
        @media screen{body{background:#ccc;padding:10px}.page{background:#fff;box-shadow:0 0 8px rgba(0,0,0,.2);margin:0 auto 10px}}
      </style></head><body>
      ${pages.join('')}
      <script>window.onload=()=>setTimeout(()=>window.print(),350);<\/script>
      </body></html>`;
    const w = window.open('', '_blank');
    if(!w){ toast('پاپ‌آپ را فعال کنید', 'err'); return; }
    w.document.open(); w.document.write(html); w.document.close();
  };

  async function getCanvasForItem(it){
    if(S.current && S.current.id === it.id && S.base) return renderFull();
    return new Promise((resolve, reject) => {
      const im = new Image();
      if(it.localBlobUrl) im.src = it.localBlobUrl;
      else { im.crossOrigin = 'anonymous'; im.src = it.url; }
      im.onload = () => {
        const maxDim = 2000;
        const w = im.naturalWidth, h = im.naturalHeight;
        const sc = Math.min(1, maxDim / Math.max(w, h));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * sc));
        c.height = Math.max(1, Math.round(h * sc));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        resolve(c);
      };
      im.onerror = reject;
    });
  }

  /* ---------- Search & Filter ---------- */
  $('#oSearch').oninput = e => { S.search = e.target.value; renderList(); };
  $$('.o-chip').forEach(chip => {
    chip.onclick = () => {
      $$('.o-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      S.filter = chip.dataset.filter;
      renderList();
    };
  });

  /* ---------- Beep toggle ---------- */
  $('#oBeep').onclick = () => {
    const s = STORE.settings;
    s.beep = !s.beep;
    STORE.settings = s;
    $('#oBeep').textContent = s.beep ? '🔔' : '🔕';
    $('#oBeep').classList.toggle('on', s.beep);
    toast(s.beep ? 'صدای اعلان روشن شد' : 'صدای اعلان خاموش شد');
  };

  /* ---------- Load history + live ---------- */
  async function loadPast(){
    try{
      const r = await fetch(`${CONFIG.NTFY}/${CONFIG.TOPIC}/json?poll=1&since=12h`, {cache:'no-store'});
      if(!r.ok) return;
      const text = await r.text();
      text.trim().split('\n').filter(Boolean).forEach(line => {
        try{ handleMessage(JSON.parse(line)); }catch(e){}
      });
    }catch(e){ console.warn(e); }
  }

  let es = null;
  function connect(){
    if(es) es.close();
    es = new EventSource(`${CONFIG.NTFY}/${CONFIG.TOPIC}/sse`);
    es.onopen = () => $('#oDot').classList.add('on');
    es.onerror = () => $('#oDot').classList.remove('on');
    es.onmessage = e => {
      try{
        const d = JSON.parse(e.data);
        if(d.event === 'message') handleMessage(d);
      }catch(e){}
    };
  }

  async function handleMessage(m){
    if(!m || !m.attachment || !m.attachment.url) return;
    if(S.items.some(x => x.id === m.id)) return;

    let name = 'مهمان', size = 0, type = '';
    try{
      const meta = JSON.parse(m.message || '{}');
      name = meta.name || m.title || 'مهمان';
      size = meta.size || m.attachment.size || 0;
      type = meta.type || m.attachment.type || '';
    }catch(e){
      name = m.title || 'مهمان';
      size = m.attachment.size || 0;
      type = m.attachment.type || '';
    }

    const item = {
      id: m.id, name, time: m.time || Math.floor(Date.now()/1000),
      url: m.attachment.url,
      mime: type || m.attachment.type || 'application/octet-stream',
      size, localBlobUrl: null,
    };

    try{
      const r = await fetch(item.url, {cache:'no-store'});
      if(r.ok) item.localBlobUrl = URL.createObjectURL(await r.blob());
    }catch(e){ console.warn('fetch failed:', e); }

    S.items.unshift(item);
    renderList();
    if(STORE.settings.beep) beep();
    toast('📥 فایل جدید از: ' + name, 'ok');
  }

  $('#oRefresh').onclick = loadPast;
  $('#oLogout').onclick = () => { location.hash = ''; location.reload(); };

  /* ---------- Keyboard shortcuts ---------- */
  document.addEventListener('keydown', e => {
    if(e.target.matches('input,textarea,select')) return;
    if(S.items.length === 0) return;
    const idx = S.current ? S.items.findIndex(x => x.id === S.current.id) : -1;
    if(e.key === 'ArrowLeft' && idx < S.items.length - 1){ openItem(S.items[idx + 1]); }
    else if(e.key === 'ArrowRight' && idx > 0){ openItem(S.items[idx - 1]); }
    else if(e.key === 'Delete' && S.current){ $('#oDel').click(); }
    else if((e.ctrlKey || e.metaKey) && e.key === 'p'){ e.preventDefault(); if(S.current) $('#oPrint').click(); }
    else if(e.key === 'r' || e.key === 'R'){ if(S.current) $('#oRotR').click(); }
    else if(e.key === 'c' || e.key === 'C'){ if(S.current) $('#oCrop').click(); }
    else if(e.key === 'Escape'){ S.cropMode = false; cropbox.style.display = 'none'; $('#oCrop').classList.remove('on'); }
  });

  /* ---------- Init ---------- */
  renderList();
  loadPast();
  connect();
}

/* =====================================================
   LOGIN
   ===================================================== */
function renderLogin(){
  document.title = 'ورود به پنل';
  $('#app').innerHTML = `
    <div class="c-wrap">
      <div class="c-card">
        <h1 style="text-align:center;margin-bottom:20px">🔒 ورود به پنل مدیریت</h1>
        <label class="c-label" for="pwd">رمز عبور</label>
        <input class="c-input" id="pwd" type="password" placeholder="رمز عبور" autofocus>
        <div class="c-err" id="e">رمز اشتباه است</div>
        <button class="c-btn pri" id="go">ورود</button>
      </div>
    </div>
  `;
  const check = () => {
    if($('#pwd').value === CONFIG.OWNER_PASSWORD){
      sessionStorage.setItem('owner_ok', '1');
      renderOwner();
    } else {
      $('#e').style.display = 'block';
    }
  };
  $('#go').onclick = check;
  $('#pwd').onkeydown = e => { if(e.key === 'Enter') check(); };
}

/* =====================================================
   BOOT
   ===================================================== */
function boot(){
  if(CONFIG.TOPIC === 'printshop-a7x9k2m3q8v1' || CONFIG.OWNER_PASSWORD === 'admin123'){
    console.warn('⚠️ لطفاً CONFIG.TOPIC و CONFIG.OWNER_PASSWORD را تغییر دهید!');
  }
  if(isOwnerMode()){
    if(sessionStorage.getItem('owner_ok') === '1') renderOwner();
    else renderLogin();
  } else {
    renderCustomer();
  }
}
boot();
window.addEventListener('hashchange', () => location.reload());
</script>
