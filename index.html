<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>ارسال فایل · چاپ سریع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#4f46e5;--pri-dark:#4338ca;--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

/* ---- Customer ---- */
.c-wrap{max-width:520px;margin:0 auto;padding:16px}
.c-card{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 10px 34px rgba(15,23,42,.09)}
.c-card h1{font-size:20px;margin:0 0 6px}
.c-sub{color:var(--mut);font-size:14px;margin:0 0 18px;line-height:1.7}
.c-label{display:block;font-size:13px;font-weight:700;margin:0 0 6px;color:#334155}
.c-input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;outline:none;background:#fff;transition:.15s}
.c-input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.c-drop{margin-top:18px;border:2px dashed #c7d2fe;border-radius:16px;padding:20px;text-align:center;background:#f5f7ff}
.c-drop .ic{font-size:38px;line-height:1}
.c-drop .t{font-weight:700;font-size:15px;margin-top:6px}
.c-drop .s{font-size:12px;color:var(--mut);margin-top:4px}
.c-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:0;border-radius:13px;font-size:16px;font-weight:700;margin-top:10px;transition:.15s}
.c-btn:active{transform:scale(.98)}
.c-btn.sec{background:#eef2ff;color:var(--pri-dark)}
.c-btn.pri{background:var(--pri);color:#fff}
.c-btn.pri:disabled{opacity:.45}
.c-preview{margin-top:16px;display:none;text-align:center}
.c-preview img{max-width:100%;max-height:240px;border-radius:12px;border:1px solid var(--line)}
.c-preview .fn{font-size:13px;color:#475569;margin-top:6px;word-break:break-all}
.c-bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px;display:none}
.c-bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .25s}
.c-ok{display:none;text-align:center;padding:24px 0}
.c-ok .tick{font-size:60px;line-height:1}
.c-ok h2{margin:10px 0 6px;font-size:19px}
.c-ok p{color:var(--mut);font-size:14px;margin:0 0 18px}
.c-err{display:none;margin-top:12px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.5}

/* ---- Owner ---- */
.o-app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.o-top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;flex:0 0 auto}
.o-top strong{font-size:15px}
.o-badge{background:#eef2ff;color:var(--pri-dark);font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.o-dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1;transition:.2s}
.o-dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.o-spacer{flex:1}
.o-tbtn{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;font-weight:600;color:#334155}
.o-tbtn:hover{background:#f8fafc}
.o-wrap{flex:1;display:flex;min-height:0}
.o-list{width:290px;flex:0 0 auto;background:#fff;border-left:1px solid var(--line);overflow-y:auto;padding:10px}
.o-item{display:flex;gap:10px;padding:9px;border-radius:11px;cursor:pointer;border:1.5px solid transparent;margin-bottom:6px;align-items:center;transition:.12s}
.o-item:hover{background:#f8fafc}
.o-item.sel{background:#eef2ff;border-color:#c7d2fe}
.o-item img,.o-item .ph{width:46px;height:46px;border-radius:8px;object-fit:cover;background:#e2e8f0;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:20px}
.o-item .info{min-width:0;flex:1}
.o-item .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o-item .tm{font-size:11px;color:var(--mut);margin-top:2px}
.o-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.o-empty{margin:auto;color:var(--mut);font-size:14px;text-align:center;padding:20px;line-height:1.8}
.o-editor{display:flex;flex-direction:column;height:100%;min-height:0}
.o-tools{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;flex:0 0 auto}
.o-grp{display:flex;align-items:center;gap:6px}
.o-grp label{font-size:12px;color:#475569;font-weight:600;display:flex;align-items:center;gap:6px}
input[type=range]{width:88px;accent-color:var(--pri)}
.o-btn{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;font-weight:600;color:#334155;white-space:nowrap}
.o-btn:hover{background:#f8fafc}
.o-btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.o-btn.pri:hover{background:var(--pri-dark)}
.o-btn.danger{color:#b91c1c;border-color:#fecaca}
.o-btn.danger:hover{background:#fef2f2}
.o-btn.on{background:var(--pri-dark);color:#fff;border-color:var(--pri-dark)}
select{padding:8px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff}
.o-stage{flex:1;overflow:auto;padding:16px;display:flex;align-items:center;justify-content:center;min-height:0;background:#e9edf3}
.o-cwrap{position:relative;max-width:100%;max-height:100%;display:inline-block;line-height:0}
#view{display:block;max-width:100%;max-height:calc(100vh - 190px);width:auto;height:auto;box-shadow:0 6px 24px rgba(15,23,42,.18);background:#fff;touch-action:none}
.cropbox{position:absolute;border:2px dashed var(--pri);background:rgba(79,70,229,.12);display:none;pointer-events:none}
.o-nofile{padding:40px;text-align:center;color:var(--mut)}
.o-nofile .ic{font-size:52px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;transition:.3s;z-index:99;opacity:0;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:820px){
  .o-wrap{flex-direction:column}
  .o-list{width:100%;height:150px;border-left:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:8px}
  .o-item{width:200px;flex:0 0 auto;margin:0}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================
//  CONFIG — این بخش را عوض کنید
// ============================================
const CONFIG = {
  // topic یکتا و تصادفی — هرچه طولانی‌تر بهتر
  TOPIC: 'printshop-a7x9k2m3q8v1',
  NTFY: 'https://ntfy.sh',
  OWNER_PASSWORD: 'admin123',
  MAX_MB: 15,
};

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => { try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return s; } };
const fmtTime = ts => {
  const d = new Date(ts*1000);
  const p = n => n<10?'0'+n:''+n;
  return p(d.getHours())+':'+p(d.getMinutes())+' · '+p(d.getDate())+'/'+(d.getMonth()+1);
};
function toast(msg){
  const t = $('#toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function isOwnerMode(){ return location.hash.indexOf('owner') !== -1; }

// ============================================
//  CUSTOMER PAGE
// ============================================
function renderCustomer(){
  document.title = 'ارسال فایل · چاپ سریع';
  $('#app').innerHTML = `
    <div class="c-wrap">
      <div class="c-card">
        <div id="cForm">
          <h1>ارسال عکس / فایل</h1>
          <p class="c-sub">نام خود را وارد کنید، سپس عکس یا فایلی که می‌خواهید چاپ شود را بارگذاری کنید.</p>
          <label class="c-label" for="cName">نام و نام خانوادگی</label>
          <input class="c-input" id="cName" type="text" placeholder="مثلاً: علی رضایی" autocomplete="name">
          <div class="c-drop">
            <div class="ic">📷</div>
            <div class="t">عکس یا فایل خود را انتخاب کنید</div>
            <div class="s">عکس، PDF یا فایل تا ${CONFIG.MAX_MB} مگابایت</div>
            <button class="c-btn sec" id="cPick">انتخاب از گالری</button>
            <button class="c-btn sec" id="cCam">گرفتن عکس با دوربین</button>
          </div>
          <div class="c-preview" id="cPrev">
            <img id="cImg" alt="">
            <div class="fn" id="cFn"></div>
          </div>
          <div class="c-bar" id="cBar"><i id="cBarI"></i></div>
          <div class="c-err" id="cErr"></div>
          <button class="c-btn pri" id="cSend" disabled>ارسال</button>
        </div>
        <div class="c-ok" id="cOk">
          <div class="tick">✅</div>
          <h2>با موفقیت ارسال شد</h2>
          <p>فایل شما دریافت شد. لطفاً منتظر بمانید تا چاپ شود.</p>
          <button class="c-btn sec" id="cAgain">ارسال فایل دیگر</button>
        </div>
      </div>
    </div>
    <input type="file" id="cFile" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt" hidden>
    <input type="file" id="cCamIn" accept="image/*" capture="environment" hidden>
    <div class="toast" id="toast"></div>
  `;
  wireCustomer();
}

function wireCustomer(){
  const nameEl = $('#cName'), fileEl = $('#cFile'), camEl = $('#cCamIn');
  const prev = $('#cPrev'), img = $('#cImg'), fnEl = $('#cFn');
  const send = $('#cSend'), bar = $('#cBar'), barI = $('#cBarI');
  const errEl = $('#cErr'), form = $('#cForm'), ok = $('#cOk');
  let chosen = null, blobUrl = null;

  const showError = m => { errEl.textContent = m; errEl.style.display = 'block'; };
  const clearError = () => { errEl.style.display = 'none'; };

  $('#cPick').onclick = ()=> fileEl.click();
  $('#cCam').onclick  = ()=> camEl.click();

  function choose(f){
    if(!f) return;
    if(f.size > CONFIG.MAX_MB * 1024 * 1024){
      showError(`حجم فایل بیشتر از ${CONFIG.MAX_MB} مگابایت است.`);
      return;
    }
    clearError();
    chosen = f;
    if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl = null; }
    prev.style.display = 'block';
    fnEl.textContent = f.name + ' (' + (f.size/1024/1024).toFixed(2) + ' مگابایت)';
    if((f.type||'').indexOf('image/') === 0){
      blobUrl = URL.createObjectURL(f);
      img.src = blobUrl;
      img.style.display = 'block';
    } else {
      img.style.display = 'none'; img.removeAttribute('src');
    }
    send.disabled = false;
  }
  fileEl.onchange = ()=> choose(fileEl.files[0]);
  camEl.onchange  = ()=> choose(camEl.files[0]);
  nameEl.oninput  = clearError;

  send.onclick = ()=>{
    const name = nameEl.value.trim();
    if(!name){ showError('لطفاً نام خود را وارد کنید.'); nameEl.focus(); return; }
    if(!chosen){ showError('لطفاً یک فایل انتخاب کنید.'); return; }

    send.disabled = true; send.textContent = 'در حال ارسال...';
    bar.style.display = 'block'; barI.style.width = '0'; clearError();

    const xhr = new XMLHttpRequest();
    xhr.open('PUT', CONFIG.NTFY + '/' + CONFIG.TOPIC);
    xhr.setRequestHeader('Title', 'b64:' + b64enc(name));
    xhr.setRequestHeader('Message', 'new');
    xhr.setRequestHeader('Filename', chosen.name);
    xhr.setRequestHeader('Tags', 'printer');

    xhr.upload.onprogress = e => {
      if(e.lengthComputable) barI.style.width = Math.round(e.loaded/e.total*100) + '%';
    };
    xhr.onload = ()=>{
      bar.style.display = 'none';
      if(xhr.status >= 200 && xhr.status < 300){
        form.style.display = 'none'; ok.style.display = 'block';
      } else {
        showError('خطا در ارسال (کد ' + xhr.status + '). دوباره تلاش کنید.');
        send.disabled = false; send.textContent = 'ارسال'; barI.style.width = '0';
      }
    };
    xhr.onerror = ()=>{
      bar.style.display = 'none';
      showError('اتصال برقرار نشد. اتصال اینترنت را بررسی کنید.');
      send.disabled = false; send.textContent = 'ارسال';
    };
    xhr.send(chosen);
  };

  $('#cAgain').onclick = ()=>{
    chosen = null;
    if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl = null; }
    fileEl.value=''; camEl.value='';
    prev.style.display='none';
    send.disabled=true; send.textContent='ارسال';
    barI.style.width='0';
    ok.style.display='none'; form.style.display='block';
    nameEl.value=''; nameEl.focus();
  };
}

// ============================================
//  OWNER PAGE
// ============================================
function renderOwner(){
  document.title = 'پنل چاپ';
  $('#app').innerHTML = `
    <div class="o-app">
      <div class="o-top">
        <strong>پنل چاپ</strong>
        <span class="o-badge" id="oCount">0</span>
        <span class="o-dot" id="oDot" title="اتصال زنده"></span>
        <div class="o-spacer"></div>
        <button class="o-tbtn" id="oRefresh">به‌روزرسانی</button>
        <button class="o-tbtn" id="oLogout">خروج</button>
      </div>
      <div class="o-wrap">
        <aside class="o-list" id="oList"></aside>
        <main class="o-main">
          <div class="o-empty" id="oEmpty">در انتظار فایل‌های جدید…<br><small style="font-size:12px">به‌محض ارسال توسط مشتری، اینجا ظاهر می‌شود.</small></div>
          <div class="o-editor" id="oEditor" style="display:none">
            <div class="o-tools">
              <div class="o-grp"><button class="o-btn" id="oRotL">↺ ۹۰°</button><button class="o-btn" id="oRotR">↻ ۹۰°</button></div>
              <div class="o-grp"><label>کجی <input type="range" id="sAngle" min="-25" max="25" value="0" step="0.2"></label></div>
              <div class="o-grp"><label>بزرگ‌نمایی <input type="range" id="sZoom" min="0.2" max="2" value="1" step="0.01"></label></div>
              <div class="o-grp"><label>روشنایی <input type="range" id="sBright" min="50" max="150" value="100"></label></div>
              <div class="o-grp"><label>کنتراست <input type="range" id="sContrast" min="50" max="150" value="100"></label></div>
              <div class="o-grp"><button class="o-btn" id="oCrop">✂ برش</button><button class="o-btn" id="oApply">✔ اعمال</button><button class="o-btn" id="oReset">بازگشت</button></div>
              <div class="o-grp">
                <select id="oPrintMode"><option value="fill">چاپ: پر کردن صفحه</option><option value="actual">چاپ: اندازه اصلی</option></select>
                <button class="o-btn pri" id="oPrint">🖨 چاپ</button>
                <button class="o-btn" id="oDownload">⬇ دانلود</button>
                <button class="o-btn danger" id="oDel">حذف</button>
              </div>
            </div>
            <div class="o-stage" id="oStage">
              <div class="o-cwrap"><canvas id="view"></canvas><div class="cropbox" id="cropbox"></div></div>
            </div>
          </div>
          <div class="o-nofile" id="oNofile" style="display:none">
            <div class="ic">📄</div>
            <p id="oNofileTxt">این فایل قابل ویرایش نیست</p>
            <a class="o-btn pri" id="oOpenRaw" target="_blank" style="display:inline-block;text-decoration:none;padding:10px 18px">باز کردن فایل</a>
            <button class="o-btn" id="oPrintRaw" style="padding:10px 18px">چاپ فایل</button>
          </div>
        </main>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  `;
  wireOwner();
}

function wireOwner(){
  const S = { items: [], current: null, base: null, orig: null, rot: 0, free: 0, zoom: 1, bright: 100, contrast: 100, cropMode: false, cropRect: null };
  const view = $('#view'), vctx = view.getContext('2d'), cropbox = $('#cropbox');
  const listEl = $('#oList'), emptyEl = $('#oEmpty'), editor = $('#oEditor'), nofile = $('#oNofile');

  const cloneCanvas = src => {
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    c.getContext('2d').drawImage(src, 0, 0);
    return c;
  };

  function renderList(){
    $('#oCount').textContent = S.items.length;
    listEl.innerHTML = '';
    S.items.forEach(it => {
      const div = document.createElement('div');
      div.className = 'o-item' + (S.current && S.current.id === it.id ? ' sel' : '');
      if((it.mime||'').indexOf('image/') === 0){
        const im = document.createElement('img');
        im.src = it.localBlobUrl || it.url;
        im.loading = 'lazy';
        im.onerror = ()=>{ im.style.display='none'; };
        div.appendChild(im);
      } else {
        const ph = document.createElement('div');
        ph.className = 'ph'; ph.textContent = '📄';
        div.appendChild(ph);
      }
      const info = document.createElement('div'); info.className = 'info';
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name;
      const tm = document.createElement('div'); tm.className = 'tm'; tm.textContent = fmtTime(it.time);
      info.appendChild(nm); info.appendChild(tm);
      div.appendChild(info);
      div.onclick = ()=> openItem(it);
      listEl.appendChild(div);
    });
  }

  function openItem(it){
    S.current = it;
    S.cropMode = false; S.cropRect = null;
    cropbox.style.display = 'none';
    $('#oCrop').classList.remove('on');
    renderList();
    emptyEl.style.display = 'none';
    editor.style.display = 'none';
    nofile.style.display = 'none';

    if((it.mime||'').indexOf('image/') !== 0){
      nofile.style.display = 'block';
      $('#oNofileTxt').textContent = it.name || 'فایل';
      $('#oOpenRaw').href = it.localBlobUrl || it.url;
      $('#oPrintRaw').onclick = ()=>{
        const w = window.open(it.localBlobUrl || it.url, '_blank');
        if(w) setTimeout(()=>{ try{ w.print(); }catch(e){} }, 900);
      };
      return;
    }

    editor.style.display = 'flex';
    const im = new Image();
    if(it.localBlobUrl){
      im.src = it.localBlobUrl;
    } else {
      im.crossOrigin = 'anonymous';
      im.src = it.url;
    }
    im.onload = ()=>{
      const maxDim = 3200;
      const w = im.naturalWidth, h = im.naturalHeight;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width  = Math.max(1, Math.round(w * scale));
      c.height = Math.max(1, Math.round(h * scale));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      S.orig = c;
      S.base = cloneCanvas(c);
      resetTransforms();
      render();
    };
    im.onerror = ()=>{
      editor.style.display = 'none';
      nofile.style.display = 'block';
      $('#oNofileTxt').textContent = 'خطا در بارگذاری تصویر';
      $('#oOpenRaw').href = it.localBlobUrl || it.url;
      $('#oPrintRaw').onclick = ()=>{
        const w = window.open(it.localBlobUrl || it.url, '_blank');
        if(w) setTimeout(()=>{ try{ w.print(); }catch(e){} }, 900);
      };
    };
  }

  function resetTransforms(){
    S.rot = 0; S.free = 0; S.zoom = 1; S.bright = 100; S.contrast = 100;
    $('#sAngle').value = 0; $('#sZoom').value = 1;
    $('#sBright').value = 100; $('#sContrast').value = 100;
  }

  function renderFull(){
    const b = S.base; if(!b) return null;
    const angle = (S.rot + S.free) * Math.PI / 180;
    const w = b.width, h = b.height;
    const cos = Math.abs(Math.cos(angle)), sin = Math.abs(Math.sin(angle));
    const outW = Math.max(1, Math.round((w*cos + h*sin) * S.zoom));
    const outH = Math.max(1, Math.round((w*sin + h*cos) * S.zoom));
    const c = document.createElement('canvas');
    c.width = outW; c.height = outH;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, outW, outH);
    ctx.translate(outW/2, outH/2);
    ctx.rotate(angle);
    ctx.scale(S.zoom, S.zoom);
    ctx.filter = `brightness(${S.bright}%) contrast(${S.contrast}%)`;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(b, -w/2, -h/2);
    return c;
  }

  function render(){
    const full = renderFull(); if(!full) return;
    const maxDim = 1400;
    const s = Math.min(1, maxDim / Math.max(full.width, full.height));
    view.width  = Math.max(1, Math.round(full.width * s));
    view.height = Math.max(1, Math.round(full.height * s));
    vctx.clearRect(0, 0, view.width, view.height);
    vctx.drawImage(full, 0, 0, view.width, view.height);
  }

  $('#oRotL').onclick = ()=>{ S.rot -= 90; render(); };
  $('#oRotR').onclick = ()=>{ S.rot += 90; render(); };
  $('#sAngle').oninput    = e=>{ S.free = parseFloat(e.target.value); render(); };
  $('#sZoom').oninput     = e=>{ S.zoom = parseFloat(e.target.value); render(); };
  $('#sBright').oninput   = e=>{ S.bright = parseFloat(e.target.value); render(); };
  $('#sContrast').oninput = e=>{ S.contrast = parseFloat(e.target.value); render(); };

  $('#oApply').onclick = ()=>{
    const full = renderFull(); if(!full) return;
    S.base = full; resetTransforms(); render(); toast('تغییرات اعمال شد');
  };
  $('#oReset').onclick = ()=>{
    if(!S.orig) return;
    S.base = cloneCanvas(S.orig); resetTransforms(); render();
    toast('به تصویر اصلی برگشت');
  };

  // ---- Crop ----
  $('#oCrop').onclick = ()=>{
    S.cropMode = !S.cropMode;
    $('#oCrop').classList.toggle('on', S.cropMode);
    if(!S.cropMode){ cropbox.style.display = 'none'; S.cropRect = null; }
    else { toast('روی تصویر بکشید تا کادر برش ساخته شود'); }
  };

  let draggingCSS = false, startX = 0, startY = 0;
  const posCSS = e => {
    const r = view.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: Math.max(0, Math.min(r.width,  p.clientX - r.left)),
             y: Math.max(0, Math.min(r.height, p.clientY - r.top )) };
  };
  function startDrag(e){
    if(!S.cropMode) return;
    e.preventDefault(); draggingCSS = true;
    const p = posCSS(e); startX = p.x; startY = p.y;
    S.cropRect = { x:p.x, y:p.y, w:0, h:0 }; updateCropBox();
  }
  function moveDrag(e){
    if(!draggingCSS) return;
    e.preventDefault();
    const p = posCSS(e);
    S.cropRect = { x: Math.min(startX,p.x), y: Math.min(startY,p.y),
                   w: Math.abs(p.x-startX), h: Math.abs(p.y-startY) };
    updateCropBox();
  }
  function endDrag(){
    if(!draggingCSS) return;
    draggingCSS = false;
    if(!S.cropRect || S.cropRect.w < 12 || S.cropRect.h < 12){
      S.cropRect = null; cropbox.style.display = 'none'; return;
    }
    applyCrop();
  }
  function updateCropBox(){
    if(!S.cropRect){ cropbox.style.display = 'none'; return; }
    cropbox.style.display = 'block';
    cropbox.style.left = S.cropRect.x+'px'; cropbox.style.top = S.cropRect.y+'px';
    cropbox.style.width = S.cropRect.w+'px'; cropbox.style.height = S.cropRect.h+'px';
  }
  function applyCrop(){
    const full = renderFull();
    if(!full || !S.cropRect) return;
    const r = view.getBoundingClientRect();
    const sx = full.width / r.width, sy = full.height / r.height;
    let cx = Math.round(S.cropRect.x*sx), cy = Math.round(S.cropRect.y*sy);
    let cw = Math.round(S.cropRect.w*sx), ch = Math.round(S.cropRect.h*sy);
    if(cw < 5 || ch < 5) return;
    cx = Math.max(0, Math.min(full.width-1, cx));
    cy = Math.max(0, Math.min(full.height-1, cy));
    cw = Math.min(cw, full.width-cx); ch = Math.min(ch, full.height-cy);
    const nc = document.createElement('canvas');
    nc.width = cw; nc.height = ch;
    nc.getContext('2d').drawImage(full, cx, cy, cw, ch, 0, 0, cw, ch);
    S.base = nc; resetTransforms();
    S.cropMode = false; S.cropRect = null;
    $('#oCrop').classList.remove('on');
    cropbox.style.display = 'none';
    render(); toast('برش انجام شد');
  }
  view.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  view.addEventListener('touchstart', startDrag, {passive:false});
  window.addEventListener('touchmove', moveDrag, {passive:false});
  window.addEventListener('touchend', endDrag);

  // ---- Print ----
  $('#oPrint').onclick = ()=>{
    const full = renderFull(); if(!full) return;
    const url = full.toDataURL('image/jpeg', 0.95);
    const mode = $('#oPrintMode').value;
    const imgCss = mode === 'fill'
      ? 'width:100%;height:100%;object-fit:contain;'
      : 'max-width:100%;max-height:100%;';
    const doc = '<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>چاپ</title>'
      + '<style>@page{size:A4;margin:8mm}html,body{margin:0;padding:0;height:100%}'
      + 'body{display:flex;align-items:center;justify-content:center}'
      + 'img{' + imgCss + '}</style></head><body>'
      + '<img src="' + url + '" onload="setTimeout(function(){window.print();},250)">'
      + '</body></html>';
    const w = window.open('', '_blank');
    w.document.open(); w.document.write(doc); w.document.close();
  };

  // ---- Download ----
  $('#oDownload').onclick = ()=>{
    const full = renderFull(); if(!full) return;
    const a = document.createElement('a');
    a.href = full.toDataURL('image/jpeg', 0.95);
    const name = S.current ? (S.current.name || 'file') : 'file';
    a.download = name + '.jpg';
    a.click();
  };

  // ---- Delete ----
  $('#oDel').onclick = ()=>{
    if(!S.current) return;
    if(!confirm('این مورد از لیست حذف شود؟')) return;
    S.items = S.items.filter(x => x.id !== S.current.id);
    S.current = null; S.base = null; S.orig = null;
    editor.style.display = 'none'; emptyEl.style.display = 'block';
    renderList(); toast('از لیست حذف شد');
  };

  // ---- Load past + live ----
  async function loadPast(){
    try{
      const r = await fetch(CONFIG.NTFY + '/' + CONFIG.TOPIC + '/json?poll=1&since=12h', {cache:'no-store'});
      if(!r.ok) return;
      const text = await r.text();
      text.trim().split('\n').filter(Boolean).forEach(line => {
        try{ handleMessage(JSON.parse(line)); }catch(e){}
      });
    }catch(e){ console.warn(e); }
  }

  let es = null;
  function connect(){
    if(es) es.close();
    es = new EventSource(CONFIG.NTFY + '/' + CONFIG.TOPIC + '/sse');
    es.onopen  = ()=> $('#oDot').classList.add('on');
    es.onerror = ()=> $('#oDot').classList.remove('on');
    es.onmessage = e => {
      try{
        const d = JSON.parse(e.data);
        if(d.event === 'message') handleMessage(d);
      }catch(e){}
    };
  }

  async function handleMessage(m){
    if(!m || m.event !== 'message') return;
    if(!m.attachment || !m.attachment.url) return;
    if(S.items.some(x => x.id === m.id)) return;

    let name = m.title || '';
    if(name.indexOf('b64:') === 0) name = b64dec(name.slice(4));
    if(!name) name = 'مهمان';

    const item = {
      id: m.id, name: name,
      time: m.time || Math.floor(Date.now()/1000),
      url: m.attachment.url,
      mime: m.attachment.type || 'application/octet-stream',
      size: m.attachment.size || 0,
      localBlobUrl: null,
    };
    try{
      const r = await fetch(item.url, {cache:'no-store'});
      if(r.ok) item.localBlobUrl = URL.createObjectURL(await r.blob());
    }catch(e){ console.warn('attachment fetch failed', e); }

    S.items.unshift(item);
    renderList();
    toast('📥 فایل جدید از: ' + name);
  }

  $('#oRefresh').onclick = loadPast;
  $('#oLogout').onclick = ()=>{ location.hash = ''; location.reload(); };

  renderList();
  loadPast();
  connect();
}

// ============================================
//  LOGIN
// ============================================
function renderLogin(){
  document.title = 'ورود به پنل';
  $('#app').innerHTML = `
    <div class="c-wrap">
      <div class="c-card">
        <h1 style="text-align:center;margin-bottom:18px">🔒 ورود به پنل مدیریت</h1>
        <label class="c-label" for="pwd">رمز عبور</label>
        <input class="c-input" id="pwd" type="password" placeholder="رمز عبور" autofocus>
        <div class="c-err" id="e">رمز اشتباه است</div>
        <button class="c-btn pri" id="go">ورود</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  `;
  const check = ()=>{
    if($('#pwd').value === CONFIG.OWNER_PASSWORD){
      sessionStorage.setItem('owner_ok', '1');
      renderOwner();
    } else {
      $('#e').style.display = 'block';
    }
  };
  $('#go').onclick = check;
  $('#pwd').onkeydown = e => { if(e.key === 'Enter') check(); };
}

// ============================================
//  BOOT
// ============================================
function boot(){
  if(isOwnerMode()){
    if(sessionStorage.getItem('owner_ok') === '1') renderOwner();
    else renderLogin();
  } else {
    renderCustomer();
  }
}
window.addEventListener('hashchange', ()=> location.reload());
boot();
</script>
