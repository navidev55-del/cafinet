<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>CafeNet — ارسال و چاپ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#6366f1;--pri-d:#4f46e5;--pri-l:#eef2ff;--pink:#ec4899;--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;--ok:#10b981;--err:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.hide{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ============ Customer Page — Modern Design ============ */
.c-bg{min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);background-size:200% 200%;animation:bgShift 18s ease infinite;padding:20px 16px;display:flex;align-items:center;justify-content:center}
@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.c-bg::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.15) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.1) 0%,transparent 40%);pointer-events:none}
.c-shell{width:100%;max-width:540px;position:relative;z-index:1}
.c-card{background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;padding:30px;box-shadow:0 25px 60px -12px rgba(15,23,42,.35),0 0 0 1px rgba(255,255,255,.5) inset;animation:cardIn .6s cubic-bezier(.16,1,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.c-head{text-align:center;margin-bottom:24px}
.c-head .logo{width:72px;height:72px;margin:0 auto 14px;background:linear-gradient(135deg,var(--pri),var(--pink));border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 12px 28px -8px rgba(99,102,241,.55);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.c-head h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.6px;background:linear-gradient(135deg,#4f46e5,#9333ea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.c-head p{color:var(--mut);font-size:13.5px;margin:8px 0 0;line-height:1.7}
.c-label{display:block;font-size:13px;font-weight:700;margin:0 0 8px;color:#334155}
.c-label .req{color:var(--err)}
.c-input{width:100%;padding:15px 18px;border:2px solid var(--line);border-radius:16px;font-size:16px;outline:none;background:#f8fafc;transition:.25s}
.c-input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
.c-input::placeholder{color:#94a3b8}

.c-drop{margin-top:20px;border:2.5px dashed #c7d2fe;border-radius:22px;padding:26px 18px;text-align:center;background:linear-gradient(135deg,#f5f7ff,#eef2ff);transition:all .3s cubic-bezier(.16,1,.3,1);cursor:pointer;position:relative;overflow:hidden}
.c-drop::before{content:'';position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,#a5b4fc,transparent 30%);animation:spin 4s linear infinite;opacity:0;transition:opacity .3s}
.c-drop:hover::before{opacity:.3}
@keyframes spin{to{transform:rotate(360deg)}}
.c-drop>*{position:relative;z-index:1}
.c-drop.drag{background:linear-gradient(135deg,#e0e7ff,#dbeafe);border-color:var(--pri);transform:scale(1.02);box-shadow:0 12px 28px -8px rgba(99,102,241,.3)}
.c-drop .ic{font-size:48px;line-height:1;margin-bottom:10px;display:inline-block;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-5deg)}75%{transform:translateY(-4px) rotate(5deg)}}
.c-drop .t{font-weight:800;font-size:16px;margin-top:4px;color:#1e1b4b}
.c-drop .s{font-size:12px;color:#64748b;margin-top:6px;margin-bottom:16px}

.c-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:0;border-radius:16px;font-size:15px;font-weight:700;margin-top:10px;transition:.25s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.c-btn:active{transform:scale(.97)}
.c-btn:disabled{opacity:.55;cursor:not-allowed}
.c-btn.sec{background:#fff;color:var(--pri-d);border:2px solid #e0e7ff}
.c-btn.sec:hover:not(:disabled){background:var(--pri-l);border-color:#c7d2fe;transform:translateY(-1px);box-shadow:0 8px 20px -6px rgba(99,102,241,.25)}
.c-btn.pri{background:linear-gradient(135deg,var(--pri),#8b5cf6,#d946ef);background-size:200% 200%;color:#fff;box-shadow:0 12px 28px -8px rgba(99,102,241,.55);margin-top:18px;padding:17px;font-size:16px;animation:priShift 4s ease infinite}
.c-btn.pri:hover:not(:disabled){animation-play-state:paused;background-position:100% 50%;transform:translateY(-2px);box-shadow:0 16px 32px -8px rgba(99,102,241,.65)}
@keyframes priShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.c-files{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.c-file{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:16px;background:#fff;transition:.25s;animation:fileIn .35s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
@keyframes fileIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.c-file::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(99,102,241,.05),transparent);transform:translateX(-100%);transition:transform .6s}
.c-file:hover::after{transform:translateX(100%)}
.c-file:hover{border-color:#c7d2fe;box-shadow:0 4px 12px -2px rgba(99,102,241,.1)}
.c-file .th{width:56px;height:56px;object-fit:cover;border-radius:12px;background:#e2e8f0;flex:0 0 auto;border:1px solid var(--line)}
.c-file .ph{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#e2e8f0;border-radius:12px;flex:0 0 auto}
.c-file .info{flex:1;min-width:0}
.c-file .nm{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1e293b}
.c-file .sz{font-size:11px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:6px}
.c-file .rm{width:36px;height:36px;border:0;border-radius:12px;background:#fee2e2;color:#b91c1c;font-weight:800;font-size:16px;flex:0 0 auto;transition:.2s}
.c-file .rm:hover{background:#fecaca;transform:scale(1.05)}

.c-bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:18px;display:none;box-shadow:inset 0 2px 4px rgba(0,0,0,.05)}
.c-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6366f1,#8b5cf6,#ec4899);background-size:200% 100%;transition:width .35s ease;border-radius:99px;animation:progShift 2s linear infinite;box-shadow:0 2px 8px rgba(99,102,241,.4)}
@keyframes progShift{to{background-position:200% 0}}
.c-info{font-size:12.5px;color:var(--mut);text-align:center;margin-top:10px;display:none;font-weight:500}
.c-err{display:none;margin-top:14px;background:#fef2f2;color:#b91c1c;border:1.5px solid #fecaca;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.6;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.c-ok{text-align:center;padding:20px 0;animation:cardIn .5s}
.c-ok .tick{font-size:88px;line-height:1;animation:tickPop .6s cubic-bezier(.16,1,.3,1);display:inline-block}
@keyframes tickPop{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.15) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.c-ok h2{margin:16px 0 8px;font-size:23px;font-weight:800;color:#15803d}
.c-ok p{color:var(--mut);font-size:14px;margin:0 0 22px;line-height:1.8}
.c-track{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #bbf7d0;color:#166534;padding:14px;border-radius:14px;font-size:12.5px;margin-bottom:20px;font-family:'Courier New',monospace;font-weight:700;letter-spacing:1.5px}

.c-footer{text-align:center;margin-top:20px;color:rgba(255,255,255,.85);font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.2)}

/* ============ OWNER PANEL ============ */
.o-app{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:#f1f5f9}
.o-top{height:64px;background:linear-gradient(135deg,#fff,#f8fafc);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;flex:0 0 auto;box-shadow:0 2px 8px -2px rgba(15,23,42,.06);z-index:10}
.o-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.3px;color:#1e1b4b}
.o-brand .bicon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pink));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;box-shadow:0 4px 12px -2px rgba(99,102,241,.4)}
.o-badge{background:linear-gradient(135deg,var(--pri),#8b5cf6);color:#fff;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;box-shadow:0 2px 6px rgba(99,102,241,.3)}
.o-dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1;transition:.3s;flex:0 0 auto}
.o-dot.on{background:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.25);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(16,185,129,.25)}50%{box-shadow:0 0 0 8px rgba(16,185,129,.1)}}
.o-spacer{flex:1}
.o-tbtn{padding:8px 14px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:13px;font-weight:600;color:#334155;white-space:nowrap;transition:.2s}
.o-tbtn:hover{background:#f8fafc;border-color:#cbd5e1;transform:translateY(-1px)}
.o-tbtn.on{background:var(--pri-l);color:var(--pri-d);border-color:#c7d2fe}
.o-wrap{flex:1;display:flex;min-height:0}
.o-side{width:340px;flex:0 0 auto;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.o-search{padding:12px;border-bottom:1px solid var(--line)}
.o-search input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:13px;outline:none;transition:.2s;background:#f8fafc}
.o-search input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.o-filters{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex:0 0 auto}
.o-chip{padding:6px 14px;border:1.5px solid var(--line);background:#fff;border-radius:99px;font-size:12px;font-weight:600;color:#475569;white-space:nowrap;flex:0 0 auto;transition:.2s}
.o-chip:hover{background:#f8fafc}
.o-chip.active{background:linear-gradient(135deg,var(--pri),#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(99,102,241,.35)}
.o-list{flex:1;overflow-y:auto;padding:10px}
.o-item{display:flex;gap:10px;padding:10px;border-radius:14px;cursor:pointer;border:2px solid transparent;margin-bottom:6px;align-items:center;transition:.15s;position:relative;background:#fff}
.o-item:hover{background:#f8fafc;border-color:#e2e8f0;transform:translateX(-2px)}
.o-item.sel{background:var(--pri-l);border-color:#c7d2fe;box-shadow:0 4px 12px -4px rgba(99,102,241,.2)}
.o-item.checked{background:#f0fdf4;border-color:#86efac}
.o-item .chk{width:22px;height:22px;border:2px solid #cbd5e1;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff;font-size:13px;color:#fff;transition:.2s;font-weight:700}
.o-item.checked .chk{background:var(--ok);border-color:var(--ok);transform:scale(1.05)}
.o-item img,.o-item .ph{width:50px;height:50px;border-radius:11px;object-fit:cover;background:#e2e8f0;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--line)}
.o-item .info{min-width:0;flex:1}
.o-item .nm{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.o-item .tm{font-size:11px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:6px}
.o-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;flex:0 0 auto}
.o-status.new{background:#fef3c7;color:#92400e}
.o-status.printing{background:#dbeafe;color:#1e40af}
.o-status.done{background:#dcfce7;color:#166534}
.o-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:linear-gradient(135deg,#e9edf3,#f1f5f9)}
.o-empty{margin:auto;color:var(--mut);font-size:14px;text-align:center;padding:30px;line-height:1.8}
.o-empty .ic{font-size:70px;margin-bottom:14px;opacity:.5;display:inline-block;animation:float 3s ease-in-out infinite}
.o-editor{display:flex;flex-direction:column;height:100%;min-height:0}
.o-tools{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;flex:0 0 auto;max-height:110px;overflow-y:auto}
.o-grp{display:flex;align-items:center;gap:6px}
.o-grp label{font-size:12px;color:#475569;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
input[type=range]{width:80px;accent-color:var(--pri);height:6px}
.o-btn{padding:7px 12px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-size:12.5px;font-weight:600;color:#334155;white-space:nowrap;transition:.15s}
.o-btn:hover{background:#f8fafc;border-color:#cbd5e1;transform:translateY(-1px)}
.o-btn.pri{background:linear-gradient(135deg,var(--pri),#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 4px 12px -2px rgba(99,102,241,.4)}
.o-btn.pri:hover{background:linear-gradient(135deg,var(--pri-d),#7c3aed)}
.o-btn.danger{color:#b91c1c;border-color:#fecaca}
.o-btn.danger:hover{background:#fef2f2}
.o-btn.on{background:var(--pri-d);color:#fff;border-color:var(--pri-d)}
.o-btn:disabled{opacity:.4;cursor:not-allowed}
select{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:12.5px;background:#fff;transition:.2s}
select:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.o-stage{flex:1;overflow:auto;padding:20px;display:flex;align-items:center;justify-content:center;min-height:0}
.o-cwrap{position:relative;max-width:100%;max-height:100%;display:inline-block;line-height:0}
#view{display:block;max-width:100%;max-height:calc(100vh - 240px);width:auto;height:auto;box-shadow:0 20px 60px -20px rgba(15,23,42,.35),0 0 0 1px rgba(255,255,255,.5);background:#fff;border-radius:6px;touch-action:none}
.cropbox{position:absolute;border:2px dashed var(--pri);background:rgba(99,102,241,.15);display:none;pointer-events:none;border-radius:2px}
.o-nofile{padding:50px;text-align:center;color:var(--mut);margin:auto}
.o-nofile .ic{font-size:64px;margin-bottom:16px;opacity:.5}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);background:#0f172a;color:#fff;padding:14px 24px;border-radius:14px;font-size:13.5px;font-weight:500;transition:.4s cubic-bezier(.16,1,.3,1);z-index:9999;opacity:0;max-width:90vw;text-align:center;box-shadow:0 16px 40px -8px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:9000;padding:16px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal.on{display:flex}
.modal-card{background:#fff;border-radius:22px;padding:26px;max-width:440px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:cardIn .35s cubic-bezier(.16,1,.3,1)}
.modal-card h3{margin:0 0 18px;font-size:18px;font-weight:800;color:#1e1b4b}
.modal-card label{display:block;font-size:12.5px;font-weight:700;color:#334155;margin:14px 0 6px}
.modal-card select,.modal-card input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;transition:.2s}
.modal-card select:focus,.modal-card input:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions button{flex:1;padding:13px;border:0;border-radius:12px;font-size:14px;font-weight:700;transition:.2s}
.modal-actions .cancel{background:#f1f5f9;color:#475569}
.modal-actions .cancel:hover{background:#e2e8f0}
.modal-actions .ok{background:linear-gradient(135deg,var(--pri),#8b5cf6);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.35)}
.modal-actions .ok:hover{background:linear-gradient(135deg,var(--pri-d),#7c3aed);transform:translateY(-1px)}

/* responsive */
@media(max-width:900px){
  .o-wrap{flex-direction:column}
  .o-side{width:100%;height:200px;border-left:0;border-bottom:1px solid var(--line)}
  .o-search{padding:8px 10px}
  .o-filters{padding:6px 10px}
  .o-list{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px}
  .o-item{width:230px;flex:0 0 auto;margin:0}
  .o-tools{max-height:none;padding:8px 10px}
  .o-top{padding:0 12px;gap:8px;height:60px}
  .o-brand span:not(.bicon){display:none}
}
@media(max-width:480px){
  .c-bg{padding:12px}
  .c-card{padding:24px 20px;border-radius:22px}
  .c-head h1{font-size:20px}
  .c-drop{padding:22px 14px}
  .o-stage{padding:10px}
  #view{max-height:calc(100vh - 300px)}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<div class="modal" id="batchModal">
  <div class="modal-card">
    <h3>🖨 چاپ دسته‌ای</h3>
    <label>تعداد عکس در هر صفحه A4</label>
    <select id="bmPerPage">
      <option value="1">۱ عدد (بزرگ)</option>
      <option value="2" selected>۲ عدد (نصف)</option>
      <option value="4">۴ عدد (کوچک)</option>
      <option value="6">۶ عدد (خیلی کوچک)</option>
      <option value="9">۹ عدد (مینی)</option>
    </select>
    <label>تعداد کپی از هر تصویر</label>
    <input type="number" id="bmCopies" value="1" min="1" max="20">
    <label>حاشیه</label>
    <select id="bmGap">
      <option value="2">نازک (۲ میلی‌متر)</option>
      <option value="4" selected>متوسط (۴ میلی‌متر)</option>
      <option value="8">ضخیم (۸ میلی‌متر)</option>
    </select>
    <div class="modal-actions">
      <button class="cancel" onclick="document.getElementById('batchModal').classList.remove('on')">لغو</button>
      <button class="ok" id="bmGo">چاپ کن</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG — این بخش را حتماً تغییر دهید
   ========================================================= */
const CONFIG = {
  TOPIC: 'printshop-a7x9k2m3q8v1',   // ⚠️ به یک رشته تصادفی طولانی تغییر دهید
  NTFY: 'https://ntfy.sh',
  OWNER_PASSWORD: 'admin123',          // ⚠️ رمز خود را بگذارید
  SHOP_NAME: 'CafeNet',
  MAX_MB: 14,
  MAX_FILES: 8,
  COMPRESS_THRESHOLD: 400 * 1024,   // فایل‌های کوچکتر از ۴۰۰KB فشرده نمی‌شوند
  COMPRESS_MAX_DIM: 1800,           // حداکثر بُعد عکس بعد از فشرده‌سازی
  COMPRESS_QUALITY: 0.8,            // کیفیت JPEG (۰-۱)
  PARALLEL_UPLOADS: 2,              // تعداد آپلود هم‌زمان
};

/* =========================================================
   UTILS
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x' + Math.random().toString(36).slice(2, 10);
const fmtTime = ts => {
  const d = new Date(ts*1000), p = n => n<10?'0'+n:''+n;
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  return p(d.getHours())+':'+p(d.getMinutes())+(isToday?'':' · '+p(d.getDate())+'/'+(d.getMonth()+1));
};
const fmtSize = bytes => bytes < 1024 ? bytes+' B' : bytes < 1048576 ? (bytes/1024).toFixed(0)+' KB' : (bytes/1048576).toFixed(2)+' MB';

let toastTimer;
function toast(msg, kind){
  const t = $('#toast'); if(!t) return;
  t.textContent = msg;
  t.style.background = kind === 'ok' ? 'linear-gradient(135deg,#10b981,#059669)' : kind === 'err' ? 'linear-gradient(135deg,#ef4444,#dc2626)' : 'linear-gradient(135deg,#0f172a,#1e293b)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function beep(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    [880, 1175].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = 'sine';
      const t = ctx.currentTime + i * 0.15;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.start(t); osc.stop(t + 0.3);
    });
  }catch(e){}
}

/* =========================================================
   فشرده‌سازی هوشمند (سرعت بالا)
   ========================================================= */
function loadImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('خطا در بارگذاری تصویر'));
    img.src = URL.createObjectURL(file);
  });
}

async function smartCompress(file){
  // فایل‌های غیر-عکس یا GIF بدون تغییر
  if(!file.type.startsWith('image/') || file.type === 'image/gif'){
    return file;
  }
  // فایل کوچک → بدون فشرده‌سازی
  if(file.size < CONFIG.COMPRESS_THRESHOLD){
    return file;
  }
  try{
    const img = await loadImage(file);
    let w = img.naturalWidth, h = img.naturalHeight;
    const maxDim = CONFIG.COMPRESS_MAX_DIM;
    if(Math.max(w, h) > maxDim){
      const s = maxDim / Math.max(w, h);
      w = Math.round(w * s); h = Math.round(h * s);
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(img.src);
    // خروجی JPEG
    const blob = await new Promise(resolve => {
      const timer = setTimeout(() => resolve(null), 8000);
      canvas.toBlob(b => { clearTimeout(timer); resolve(b); }, 'image/jpeg', CONFIG.COMPRESS_QUALITY);
    });
    if(blob && blob.size < file.size){
      const baseName = (file.name || 'photo').replace(/\.[^.]+$/, '');
      return new File([blob], baseName + '.jpg', { type: 'image/jpeg' });
    }
    return file;
  }catch(e){
    console.warn('compression failed:', e);
    return file;
  }
}

function wireCustomer(){
  const nameEl = $('#cName'), fileEl = $('#cFile'), camEl = $('#cCamIn');
  const filesEl = $('#cFiles'), sendBtn = $('#cSend');
  const bar = $('#cBar'), barI = $('#cBarI'), info = $('#cInfo');
  const errEl = $('#cErr'), form = $('#cForm'), ok = $('#cOk');
  const dropZone = $('#cDrop');

  let files = [];

  const showError = m => { errEl.textContent = m; errEl.style.display = 'block'; };
  const clearError = () => { errEl.style.display = 'none'; };

  function updateUI(){
    filesEl.innerHTML = '';
    files.forEach(f => {
      const div = document.createElement('div');
      div.className = 'c-file';
      const thumbHtml = f.thumb
        ? `<img class="th" src="${f.thumb}" alt="">`
        : `<div class="ph">📄</div>`;
      div.innerHTML = `${thumbHtml}<div class="info"><div class="nm">${esc(f.file.name)}</div><div class="sz">${fmtSize(f.file.size)}</div></div><button class="rm" data-id="${f.id}" title="حذف">✕</button>`;
      filesEl.appendChild(div);
    });
    filesEl.querySelectorAll('.rm').forEach(b => {
      b.onclick = () => {
        const i = files.findIndex(x => x.id === b.dataset.id);
        if(i >= 0){ if(files[i].thumb) URL.revokeObjectURL(files[i].thumb); files.splice(i,1); updateUI(); }
      };
    });
    sendBtn.disabled = files.length === 0;
    sendBtn.textContent = files.length > 0 ? `🚀 ارسال ${files.length} فایل` : '🚀 ارسال';
  }

  async function addFiles(list){
    clearError();
    const arr = Array.from(list || []);
    for(const file of arr){
      if(files.length >= CONFIG.MAX_FILES){ showError(`حداکثر ${CONFIG.MAX_FILES} فایل مجاز است`); break; }
      if(file.size > CONFIG.MAX_MB * 1024 * 1024){ showError(`«${file.name}» بزرگ‌تر از ${CONFIG.MAX_MB}MB است`); continue; }
      if(files.some(x => x.file.name === file.name && x.file.size === file.size)) continue;
      const thumb = file.type.startsWith('image/') ? URL.createObjectURL(file) : null;
      files.push({ id: uid(), file, thumb });
      updateUI();
    }
  }

  $('#cPick').onclick = () => fileEl.click();
  $('#cCam').onclick  = () => camEl.click();
  fileEl.onchange = () => { addFiles(fileEl.files); fileEl.value = ''; };
  camEl.onchange  = () => { addFiles(camEl.files); camEl.value = ''; };
  nameEl.oninput  = clearError;

  // Drag & drop
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag');
    addFiles(e.dataTransfer.files);
  });

  /* ---------- ارسال ---------- */
  sendBtn.onclick = async () => {
    const name = nameEl.value.trim();
    if(!name){ showError('لطفاً نام خود را وارد کنید.'); nameEl.focus(); return; }
    if(!files.length){ showError('لطفاً حداقل یک فایل انتخاب کنید.'); return; }

    sendBtn.disabled = true;
    sendBtn.textContent = '⏳ آماده‌سازی...';
    clearError();
    bar.style.display = 'block'; barI.style.width = '0';
    info.style.display = 'block'; info.textContent = 'فشرده‌سازی عکس‌ها...';

    try{
      // ۱. فشرده‌سازی همه (به‌صورت سریالی برای امنیت حافظه)
      const prepared = [];
      for(let i = 0; i < files.length; i++){
        info.textContent = `فشرده‌سازی ${i+1} از ${files.length}...`;
        const compressed = await smartCompress(files[i].file);
        prepared.push({ orig: files[i].file, data: compressed });
      }

      // ۲. آپلود گروهی
      const tracking = [];
      const total = prepared.length;
      let completedBytes = 0;
      const byteSizes = prepared.map(p => p.data.size);
      const totalBytes = byteSizes.reduce((a,b) => a+b, 0);

      info.textContent = `آپلود ۰ از ${total}...`;

      for(let i = 0; i < prepared.length; i++){
        const result = await uploadOne(name, prepared[i].data, (pct) => {
          const currentBytes = (byteSizes[i] * pct / 100);
          const progressPct = ((completedBytes + currentBytes) / totalBytes) * 100;
          barI.style.width = progressPct.toFixed(1) + '%';
        });
        tracking.push(result.id);
        completedBytes += byteSizes[i];
        info.textContent = `آپلود ${i+1} از ${total}...`;
      }

      barI.style.width = '100%';
      info.textContent = 'تکمیل شد!';

      setTimeout(() => {
        form.classList.add('hide');
        ok.classList.remove('hide');
        const trackText = tracking.length === 1
          ? 'کد پیگیری: ' + tracking[0].slice(-8).toUpperCase()
          : 'کد پیگیری: ' + tracking.map(t => t.slice(-6)).join(' · ').toUpperCase();
        $('#cTrack').textContent = trackText;
      }, 350);

    }catch(err){
      console.error('[UPLOAD ERROR]', err);
      bar.style.display = 'none';
      info.style.display = 'none';
      showError(err.message || 'خطا در ارسال. اتصال اینترنت را بررسی کنید.');
      sendBtn.disabled = false;
      sendBtn.textContent = files.length > 0 ? `🚀 ارسال ${files.length} فایل` : '🚀 ارسال';
    }
  };

  /* ---------- آپلود یک فایل به ntfy — روش قطعی ---------- */
  function uploadOne(name, file, onProgress){
    return new Promise((resolve, reject) => {
      // ✅ نام فایل ASCII-safe (ntfy هدر ASCII می‌خواهد)
      const extMatch = (file.name || '').match(/\.([a-zA-Z0-9]{2,5})$/);
      const ext = extMatch ? extMatch[1].toLowerCase() : 'jpg';
      const safeName = 'photo-' + Date.now() + '-' + Math.random().toString(36).slice(2,6) + '.' + ext;

      // ✅ نام فارسی و متادیتا در query param (URL-encoded، Unicode پشتیبانی می‌شود)
      const qs = new URLSearchParams();
      qs.set('title', name.slice(0, 60));
      qs.set('message', JSON.stringify({
        name: name,
        filename: file.name,
        size: file.size,
        type: file.type,
      }));
      qs.set('tags', 'camera');

      const url = CONFIG.NTFY + '/' + encodeURIComponent(CONFIG.TOPIC) + '?' + qs.toString();

      const xhr = new XMLHttpRequest();
      xhr.open('PUT', url, true);
      // ✅ هدر Filename فقط ASCII-safe
      xhr.setRequestHeader('Filename', safeName);
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

      xhr.upload.onprogress = e => {
        if(e.lengthComputable && onProgress) onProgress((e.loaded / e.total) * 100);
      };

      xhr.onload = () => {
        if(xhr.status >= 200 && xhr.status < 300){
          let id = uid();
          try{
            const res = JSON.parse(xhr.responseText);
            const msg = Array.isArray(res) ? res[0] : res;
            if(msg && msg.id) id = msg.id;
          }catch(e){}
          resolve({ id });
        } else if(xhr.status === 413){
          reject(new Error('فایل خیلی بزرگ است (سقف ۱۵ مگابایت ntfy.sh)'));
        } else if(xhr.status === 429){
          reject(new Error('سرعت ارسال زیاد. چند لحظه صبر کنید و دوباره تلاش کنید.'));
        } else if(xhr.status === 401 || xhr.status === 403){
          reject(new Error('دسترسی رد شد. تنظیمات TOPIC را بررسی کنید.'));
        } else {
          reject(new Error(`خطا در سرور (${xhr.status}). دوباره تلاش کنید.`));
        }
      };

      xhr.onerror = () => reject(new Error('اتصال برقرار نشد. اینترنت یا وای‌فای را بررسی کنید.'));
      xhr.ontimeout = () => reject(new Error('زمان ارسال تمام شد. فایل کوچک‌تری امتحان کنید.'));
      xhr.timeout = 120000;
      xhr.send(file);
    });
  }

  /* ---------- ارسال دوباره ---------- */
  $('#cAgain').onclick = () => {
    files.forEach(f => f.thumb && URL.revokeObjectURL(f.thumb));
    files = [];
    updateUI();
    bar.style.display = 'none'; barI.style.width = '0';
    info.style.display = 'none';
    ok.classList.add('hide'); form.classList.remove('hide');
    nameEl.value = ''; nameEl.focus();
  };
}

function wireOwner(){
  const S = {
    items: [], current: null, base: null, orig: null,
    rot: 0, free: 0, zoom: 1, bright: 100, contrast: 100, filter: 'none',
    cropMode: false, cropRect: null,
    selected: new Set(), filter: 'all', search: '',
  };
  const view = $('#view'), vctx = view.getContext('2d'), cropbox = $('#cropbox');
  const listEl = $('#oList'), emptyEl = $('#oEmpty'), editor = $('#oEditor'), nofile = $('#oNofile');

  const cloneCanvas = src => {
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    c.getContext('2d').drawImage(src, 0, 0);
    return c;
  };

  function renderList(){
    $('#oCount').textContent = S.items.length;
    const statuses = STORE.statuses;
    const filtered = S.items.filter(it => {
      if(S.filter !== 'all' && (statuses[it.id] || 'new') !== S.filter) return false;
      if(S.search && !it.name.toLowerCase().includes(S.search.toLowerCase())) return false;
      return true;
    });

    listEl.innerHTML = '';
    if(filtered.length === 0){
      listEl.innerHTML = '<div style="text-align:center;padding:40px 10px;color:#94a3b8;font-size:13px">موردی یافت نشد</div>';
      return;
    }

    filtered.forEach(it => {
      const st = statuses[it.id] || 'new';
      const div = document.createElement('div');
      div.className = 'o-item' + (S.current && S.current.id === it.id ? ' sel' : '') + (S.selected.has(it.id) ? ' checked' : '');

      const chk = document.createElement('div');
      chk.className = 'chk';
      chk.textContent = '✓';
      chk.onclick = e => {
        e.stopPropagation();
        if(S.selected.has(it.id)) S.selected.delete(it.id);
        else S.selected.add(it.id);
        renderList();
      };
      div.appendChild(chk);

      if((it.mime||'').startsWith('image/')){
        const im = document.createElement('img');
        im.src = it.localBlobUrl || it.url;
        im.loading = 'lazy';
        im.onerror = () => { im.style.display = 'none'; };
        div.appendChild(im);
      } else {
        const ph = document.createElement('div');
        ph.className = 'ph'; ph.textContent = '📄';
        div.appendChild(ph);
      }

      const info = document.createElement('div');
      info.className = 'info';
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.innerHTML = `${esc(it.name)} <span class="o-status ${st}">${st === 'new'?'جدید':st==='printing'?'در چاپ':'چاپ شد'}</span>`;
      const tm = document.createElement('div');
      tm.className = 'tm';
      tm.textContent = fmtTime(it.time) + (it.size ? ' · ' + fmtSize(it.size) : '');
      info.appendChild(nm); info.appendChild(tm);
      div.appendChild(info);

      div.onclick = () => openItem(it);
      listEl.appendChild(div);
    });
  }

  function openItem(it){
    S.current = it;
    S.cropMode = false; S.cropRect = null;
    cropbox.style.display = 'none';
    $('#oCrop').classList.remove('on');
    $('#oStatusSel').value = STORE.statuses[it.id] || 'new';
    renderList();
    emptyEl.classList.add('hide');
    editor.classList.add('hide');
    nofile.classList.add('hide');

    if(!(it.mime||'').startsWith('image/')){
      nofile.classList.remove('hide');
      $('#oNofileTxt').textContent = it.name || 'فایل';
      $('#oOpenRaw').href = it.localBlobUrl || it.url;
      $('#oPrintRaw').onclick = () => {
        const w = window.open(it.localBlobUrl || it.url, '_blank');
        if(w) setTimeout(() => { try{ w.print(); }catch(e){} }, 900);
      };
      return;
    }

    editor.classList.remove('hide');
    const im = new Image();
    if(it.localBlobUrl) im.src = it.localBlobUrl;
    else { im.crossOrigin = 'anonymous'; im.src = it.url; }
    im.onload = () => {
      const maxDim = 3200;
      const w = im.naturalWidth, h = im.naturalHeight;
      const sc = Math.min(1, maxDim / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * sc));
      c.height = Math.max(1, Math.round(h * sc));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      S.orig = c; S.base = cloneCanvas(c);
      resetTransforms();
      render();
    };
    im.onerror = () => {
      editor.classList.add('hide');
      nofile.classList.remove('hide');
      $('#oNofileTxt').textContent = 'خطا در بارگذاری تصویر';
      $('#oOpenRaw').href = it.localBlobUrl || it.url;
    };
  }

  function resetTransforms(){
    S.rot = 0; S.free = 0; S.zoom = 1; S.bright = 100; S.contrast = 100; S.filter = 'none';
    $('#sAngle').value = 0; $('#sZoom').value = 1;
    $('#sBright').value = 100; $('#sContrast').value = 100;
    $('#oFilter').value = 'none';
  }

  function renderFull(){
    const b = S.base; if(!b) return null;
    const angle = (S.rot + S.free) * Math.PI / 180;
    const w = b.width, h = b.height;
    const cos = Math.abs(Math.cos(angle)), sin = Math.abs(Math.sin(angle));
    const outW = Math.max(1, Math.round((w*cos + h*sin) * S.zoom));
    const outH = Math.max(1, Math.round((w*sin + h*cos) * S.zoom));
    const c = document.createElement('canvas');
    c.width = outW; c.height = outH;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, outW, outH);
    ctx.translate(outW/2, outH/2);
    ctx.rotate(angle);
    ctx.scale(S.zoom, S.zoom);
    const filt = `brightness(${S.bright}%) contrast(${S.contrast}%) ${S.filter === 'none' ? '' : S.filter}`;
    ctx.filter = filt;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(b, -w/2, -h/2);
    return c;
  }

  function render(){
    const full = renderFull(); if(!full) return;
    const maxDim = 1400;
    const s = Math.min(1, maxDim / Math.max(full.width, full.height));
    view.width = Math.max(1, Math.round(full.width * s));
    view.height = Math.max(1, Math.round(full.height * s));
    vctx.clearRect(0, 0, view.width, view.height);
    vctx.drawImage(full, 0, 0, view.width, view.height);
  }

  $('#oRotL').onclick = () => { S.rot -= 90; render(); };
  $('#oRotR').onclick = () => { S.rot += 90; render(); };
  $('#sAngle').oninput    = e => { S.free = parseFloat(e.target.value); render(); };
  $('#sZoom').oninput     = e => { S.zoom = parseFloat(e.target.value); render(); };
  $('#sBright').oninput   = e => { S.bright = parseFloat(e.target.value); render(); };
  $('#sContrast').oninput = e => { S.contrast = parseFloat(e.target.value); render(); };
  $('#oFilter').onchange  = e => { S.filter = e.target.value; render(); };

  $('#oApply').onclick = () => {
    const full = renderFull(); if(!full) return;
    S.base = full; resetTransforms(); render();
    toast('تغییرات اعمال شد', 'ok');
  };
  $('#oReset').onclick = () => {
    if(!S.orig) return;
    S.base = cloneCanvas(S.orig); resetTransforms(); render();
    toast('به تصویر اصلی برگشت');
  };

  $('#oStatusSel').onchange = e => {
    if(!S.current) return;
    const s = STORE.statuses;
    s[S.current.id] = e.target.value;
    STORE.statuses = s;
    renderList();
    toast('وضعیت به‌روز شد', 'ok');
  };

  $('#oCrop').onclick = () => {
    S.cropMode = !S.cropMode;
    $('#oCrop').classList.toggle('on', S.cropMode);
    if(!S.cropMode){ cropbox.style.display = 'none'; S.cropRect = null; }
    else toast('روی تصویر بکشید تا کادر برش ساخته شود');
  };

  let dragging = false, sx = 0, sy = 0;
  const posOf = e => {
    const r = view.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: Math.max(0, Math.min(r.width, p.clientX - r.left)), y: Math.max(0, Math.min(r.height, p.clientY - r.top)) };
  };
  function startDrag(e){
    if(!S.cropMode) return;
    e.preventDefault(); dragging = true;
    const p = posOf(e); sx = p.x; sy = p.y;
    S.cropRect = { x:p.x, y:p.y, w:0, h:0 }; updateCropBox();
  }
  function moveDrag(e){
    if(!dragging) return;
    e.preventDefault();
    const p = posOf(e);
    S.cropRect = { x: Math.min(sx,p.x), y: Math.min(sy,p.y), w: Math.abs(p.x-sx), h: Math.abs(p.y-sy) };
    updateCropBox();
  }
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    if(!S.cropRect || S.cropRect.w < 12 || S.cropRect.h < 12){
      S.cropRect = null; cropbox.style.display = 'none'; return;
    }
    applyCrop();
  }
  function updateCropBox(){
    if(!S.cropRect){ cropbox.style.display = 'none'; return; }
    cropbox.style.display = 'block';
    cropbox.style.left = S.cropRect.x+'px'; cropbox.style.top = S.cropRect.y+'px';
    cropbox.style.width = S.cropRect.w+'px'; cropbox.style.height = S.cropRect.h+'px';
  }
  function applyCrop(){
    const full = renderFull();
    if(!full || !S.cropRect) return;
    const r = view.getBoundingClientRect();
    const sclX = full.width / r.width, sclY = full.height / r.height;
    let cx = Math.round(S.cropRect.x*sclX), cy = Math.round(S.cropRect.y*sclY);
    let cw = Math.round(S.cropRect.w*sclX), ch = Math.round(S.cropRect.h*sclY);
    if(cw < 5 || ch < 5) return;
    cx = Math.max(0, Math.min(full.width-1, cx));
    cy = Math.max(0, Math.min(full.height-1, cy));
    cw = Math.min(cw, full.width-cx); ch = Math.min(ch, full.height-cy);
    const nc = document.createElement('canvas');
    nc.width = cw; nc.height = ch;
    nc.getContext('2d').drawImage(full, cx, cy, cw, ch, 0, 0, cw, ch);
    S.base = nc; resetTransforms();
    S.cropMode = false; S.cropRect = null;
    $('#oCrop').classList.remove('on');
    cropbox.style.display = 'none';
    render(); toast('برش انجام شد', 'ok');
  }
  view.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  view.addEventListener('touchstart', startDrag, {passive:false});
  window.addEventListener('touchmove', moveDrag, {passive:false});
  window.addEventListener('touchend', endDrag);

  $('#oPrint').onclick = () => {
    const full = renderFull(); if(!full) return;
    const url = full.toDataURL('image/jpeg', 0.94);
    const doc = `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>چاپ</title>
      <style>@page{size:A4;margin:8mm}html,body{margin:0;padding:0;height:100%}
      body{display:flex;align-items:center;justify-content:center}
      img{max-width:100%;max-height:100%;object-fit:contain}</style></head>
      <body><img src="${url}" onload="setTimeout(()=>window.print(),250)"></body></html>`;
    const w = window.open('', '_blank');
    if(!w){ toast('پاپ‌آپ را فعال کنید', 'err'); return; }
    w.document.open(); w.document.write(doc); w.document.close();
  };

  $('#oDownload').onclick = () => {
    const full = renderFull(); if(!full) return;
    const a = document.createElement('a');
    a.href = full.toDataURL('image/jpeg', 0.94);
    a.download = (S.current ? (S.current.name || 'file') : 'file') + '.jpg';
    a.click();
  };

  $('#oDel').onclick = () => {
    if(!S.current) return;
    if(!confirm('این مورد از لیست حذف شود؟')) return;
    S.items = S.items.filter(x => x.id !== S.current.id);
    const st = STORE.statuses; delete st[S.current.id]; STORE.statuses = st;
    S.selected.delete(S.current.id);
    S.current = null; S.base = null; S.orig = null;
    editor.classList.add('hide'); emptyEl.classList.remove('hide');
    renderList(); toast('حذف شد');
  };

  $('#oBatch').onclick = () => {
    if(S.selected.size === 0){ toast('ابتدا موارد را با ✅ علامت بزنید', 'err'); return; }
    $('#batchModal').classList.add('on');
  };
  $('#bmGo').onclick = async () => {
    const perPage = parseInt($('#bmPerPage').value);
    const copies = Math.max(1, parseInt($('#bmCopies').value) || 1);
    const gap = parseInt($('#bmGap').value);
    $('#batchModal').classList.remove('on');

    const items = S.items.filter(x => S.selected.has(x.id));
    const expanded = [];
    items.forEach(it => { for(let i = 0; i < copies; i++) expanded.push(it); });

    toast('در حال آماده‌سازی...', 'ok');

    const canvases = [];
    for(const it of expanded){
      try{
        const c = await getCanvasForItem(it);
        if(c) canvases.push(c);
      }catch(e){ console.warn(e); }
    }
    if(canvases.length === 0){ toast('خطا در آماده‌سازی', 'err'); return; }

    const cols = perPage === 1 ? 1 : perPage === 2 ? 2 : perPage === 4 ? 2 : 3;
    const rows = Math.ceil(perPage / cols);
    const pages = [];
    for(let i = 0; i < canvases.length; i += perPage){
      const chunk = canvases.slice(i, i + perPage);
      const cells = chunk.map(c => `<div class="cell"><img src="${c.toDataURL('image/jpeg', 0.9)}"></div>`).join('');
      pages.push(`<div class="page">${cells}</div>`);
    }
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>چاپ دسته‌ای</title>
      <style>
        @page{size:A4;margin:5mm}*{box-sizing:border-box}html,body{margin:0;padding:0}
        .page{display:grid;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);gap:${gap}mm;width:200mm;height:287mm;page-break-after:always}
        .page:last-child{page-break-after:auto}
        .cell{display:flex;align-items:center;justify-content:center;overflow:hidden}
        .cell img{max-width:100%;max-height:100%;object-fit:contain}
        @media screen{body{background:#ccc;padding:10px}.page{background:#fff;box-shadow:0 0 8px rgba(0,0,0,.2);margin:0 auto 10px}}
      </style></head><body>${pages.join('')}
      <script>window.onload=()=>setTimeout(()=>window.print(),350);<\/script></body></html>`;
    const w = window.open('', '_blank');
    if(!w){ toast('پاپ‌آپ را فعال کنید', 'err'); return; }
    w.document.open(); w.document.write(html); w.document.close();
  };

  async function getCanvasForItem(it){
    if(S.current && S.current.id === it.id && S.base) return renderFull();
    return new Promise((resolve, reject) => {
      const im = new Image();
      if(it.localBlobUrl) im.src = it.localBlobUrl;
      else { im.crossOrigin = 'anonymous'; im.src = it.url; }
      im.onload = () => {
        const maxDim = 2000;
        const w = im.naturalWidth, h = im.naturalHeight;
        const sc = Math.min(1, maxDim / Math.max(w, h));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * sc));
        c.height = Math.max(1, Math.round(h * sc));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        resolve(c);
      };
      im.onerror = reject;
    });
  }

  $('#oSearch').oninput = e => { S.search = e.target.value; renderList(); };
  $$('.o-chip').forEach(chip => {
    chip.onclick = () => {
      $$('.o-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      S.filter = chip.dataset.filter;
      renderList();
    };
  });

  $('#oBeep').onclick = () => {
    const s = STORE.settings;
    s.beep = !s.beep;
    STORE.settings = s;
    $('#oBeep').textContent = s.beep ? '🔔' : '🔕';
    $('#oBeep').classList.toggle('on', s.beep);
    toast(s.beep ? 'صدای اعلان روشن شد' : 'صدای اعلان خاموش شد');
  };

  async function loadPast(){
    try{
      const r = await fetch(CONFIG.NTFY + '/' + encodeURIComponent(CONFIG.TOPIC) + '/json?poll=1&since=12h', {cache:'no-store'});
      if(!r.ok) return;
      const text = await r.text();
      text.trim().split('\n').filter(Boolean).forEach(line => {
        try{ handleMessage(JSON.parse(line)); }catch(e){}
      });
    }catch(e){ console.warn(e); }
  }

  let es = null;
  function connect(){
    if(es) es.close();
    es = new EventSource(CONFIG.NTFY + '/' + encodeURIComponent(CONFIG.TOPIC) + '/sse');
    es.onopen = () => $('#oDot').classList.add('on');
    es.onerror = () => $('#oDot').classList.remove('on');
    es.onmessage = e => {
      try{
        const d = JSON.parse(e.data);
        if(d.event === 'message') handleMessage(d);
      }catch(e){}
    };
  }

  async function handleMessage(m){
    if(!m || !m.attachment || !m.attachment.url) return;
    if(S.items.some(x => x.id === m.id)) return;

    let name = 'مهمان', size = 0, type = '';
    try{
      const meta = JSON.parse(m.message || '{}');
      name = meta.name || m.title || 'مهمان';
      size = meta.size || m.attachment.size || 0;
      type = meta.type || m.attachment.type || '';
    }catch(e){
      name = m.title || 'مهمان';
      size = m.attachment.size || 0;
      type = m.attachment.type || '';
    }

    const item = {
      id: m.id, name, time: m.time || Math.floor(Date.now()/1000),
      url: m.attachment.url,
      mime: type || m.attachment.type || 'application/octet-stream',
      size, localBlobUrl: null,
    };

    try{
      const r = await fetch(item.url, {cache:'no-store'});
      if(r.ok) item.localBlobUrl = URL.createObjectURL(await r.blob());
    }catch(e){ console.warn('fetch failed:', e); }

    S.items.unshift(item);
    renderList();
    if(STORE.settings.beep) beep();
    toast('📥 فایل جدید از: ' + name, 'ok');
  }

  $('#oRefresh').onclick = loadPast;
  $('#oLogout').onclick = () => { location.hash = ''; location.reload(); };

  document.addEventListener('keydown', e => {
    if(e.target.matches('input,textarea,select')) return;
    if(S.items.length === 0) return;
    const idx = S.current ? S.items.findIndex(x => x.id === S.current.id) : -1;
    if(e.key === 'ArrowLeft' && idx < S.items.length - 1) openItem(S.items[idx + 1]);
    else if(e.key === 'ArrowRight' && idx > 0) openItem(S.items[idx - 1]);
    else if(e.key === 'Delete' && S.current) $('#oDel').click();
    else if((e.ctrlKey || e.metaKey) && e.key === 'p'){ e.preventDefault(); if(S.current) $('#oPrint').click(); }
    else if(e.key === 'r' || e.key === 'R'){ if(S.current) $('#oRotR').click(); }
    else if(e.key === 'c' || e.key === 'C'){ if(S.current) $('#oCrop').click(); }
    else if(e.key === 'Escape'){ S.cropMode = false; cropbox.style.display = 'none'; $('#oCrop').classList.remove('on'); }
  });

  renderList();
  loadPast();
  connect();
}

/* =========================================================
   LOGIN
   ========================================================= */
function renderLogin(){
  document.title = 'ورود به پنل';
  $('#app').innerHTML = `
    <div class="c-bg">
      <div class="c-shell">
        <div class="c-card">
          <div class="c-head">
            <div class="logo">🔒</div>
            <h1>ورود به پنل مدیریت</h1>
            <p>لطفاً رمز عبور خود را وارد کنید</p>
          </div>
          <label class="c-label" for="pwd">رمز عبور</label>
          <input class="c-input" id="pwd" type="password" placeholder="رمز عبور" autofocus>
          <div class="c-err" id="e">رمز اشتباه است</div>
          <button class="c-btn pri" id="go">ورود</button>
        </div>
        <div class="c-footer">${esc(CONFIG.SHOP_NAME)}</div>
      </div>
    </div>
  `;
  const check = () => {
    if($('#pwd').value === CONFIG.OWNER_PASSWORD){
      sessionStorage.setItem('owner_ok', '1');
      renderOwner();
    } else {
      $('#e').style.display = 'block';
    }
  };
  $('#go').onclick = check;
  $('#pwd').onkeydown = e => { if(e.key === 'Enter') check(); };
}

/* =========================================================
   BOOT
   ========================================================= */
function boot(){
  if(CONFIG.TOPIC === 'printshop-a7x9k2m3q8v1' || CONFIG.OWNER_PASSWORD === 'admin123'){
    console.warn('⚠️ CONFIG.TOPIC و CONFIG.OWNER_PASSWORD را تغییر دهید!');
  }
  if(isOwnerMode()){
    if(sessionStorage.getItem('owner_ok') === '1') renderOwner();
    else renderLogin();
  } else {
    renderCustomer();
  }
}
boot();
window.addEventListener('hashchange', () => location.reload());
</script>
